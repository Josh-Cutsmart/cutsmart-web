<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Company Settings Preview</title>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>
/* ===== Tokens (copied from app/globals.css so the preview reads like the real app) ===== */
:root {
  --brand: #007aff; --brand-strong: #0064d6; --brand-soft: #d9ebff;
  --brand-gradient: linear-gradient(135deg, #2b9cff 0%, #0064d6 100%);
  --bg-app: #eef1f8; --panel-bg: #ffffff; --panel-border: #e5e5ea; --panel-muted: #fbfbfd;
  --text-main: #111111; --text-muted: #6e6e73;
  --danger: #dc2626; --danger-strong: #b42318; --danger-soft: #fef2f2;
  --danger-gradient: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
  --success: #16a34a; --success-soft: #f0fdf4;
  --glass-bg: rgba(255,255,255,0.6); --glass-bg-strong: rgba(255,255,255,0.78);
  --glass-modal-bg: rgba(238,241,248,0.55); --glass-border: rgba(15,23,42,0.08);
  --shadow-glass: 0 8px 32px rgba(31,41,55,0.10), 0 1px 1px rgba(31,41,55,0.05);
  --sheen: rgba(255,255,255,0.6);
  --field-bg: rgba(255,255,255,0.55);
  --field-border: rgba(15,23,42,0.12);
  --row-hover: rgba(15,23,42,0.035);
  --wash-1: rgba(0,122,255,0.10); --wash-2: rgba(124,108,240,0.08); --wash-3: rgba(23,179,163,0.07);
}
:root[data-theme="dark"] {
  --brand: #3ea6ff; --brand-strong: #65b8ff; --brand-soft: #233447;
  --brand-gradient: linear-gradient(135deg, #59b4ff 0%, #2e7fd6 100%);
  --bg-app: #0b0d12; --panel-bg: #1b1b1f; --panel-border: #3f3f46; --panel-muted: #232327;
  --text-main: #f1f1f1; --text-muted: #a1a1aa;
  --danger: #f87171; --danger-strong: #fca5a5; --danger-soft: #3a1a1a;
  --success: #4ade80; --success-soft: #14291b;
  --glass-bg: rgba(28,28,32,0.6); --glass-bg-strong: rgba(28,28,32,0.82);
  --glass-modal-bg: rgba(24,24,28,0.55); --glass-border: rgba(255,255,255,0.09);
  --shadow-glass: 0 8px 32px rgba(0,0,0,0.5), 0 1px 1px rgba(0,0,0,0.3);
  --sheen: rgba(255,255,255,0.06);
  --field-bg: rgba(255,255,255,0.05);
  --field-border: rgba(255,255,255,0.14);
  --row-hover: rgba(255,255,255,0.04);
  --wash-1: rgba(62,166,255,0.10); --wash-2: rgba(124,108,240,0.08); --wash-3: rgba(23,179,163,0.05);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: "SF Pro Text", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
  color: var(--text-main);
  background:
    radial-gradient(900px 600px at 0% 0%, var(--wash-1), transparent 70%),
    radial-gradient(800px 600px at 100% 10%, var(--wash-2), transparent 70%),
    radial-gradient(900px 700px at 50% 100%, var(--wash-3), transparent 70%),
    var(--bg-app);
  background-attachment: fixed;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }

/* ===== Glass primitives ===== */
.glass {
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 1px 0 var(--sheen), var(--shadow-glass);
}
.glass-strong { background: var(--glass-bg-strong); }

/* ===== Top bar (stand-in for the app's tab bar) ===== */
.topbar {
  position: sticky; top: 0; z-index: 50; height: 48px;
  display: flex; align-items: center; gap: 10px; padding: 0 16px;
  background: var(--glass-modal-bg); border-bottom: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(12px) saturate(220%); backdrop-filter: blur(12px) saturate(220%);
}
.topbar .brand { font-weight: 700; letter-spacing: .3px; }
.preview-pill { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-strong); }
.topbar .spacer { flex: 1; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px;
  border-radius: 10px; border: 1px solid var(--glass-border); background: var(--field-bg);
}
.icon-btn:hover { filter: brightness(.97); }

/* ===== Shell ===== */
.shell { display: grid; grid-template-columns: 264px 1fr; gap: 20px; padding: 20px; max-width: 1480px; margin: 0 auto; }
.rail { position: sticky; top: 68px; align-self: start; border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100vh - 88px); }
.rail-title { display: flex; align-items: center; gap: 8px; padding: 4px 6px 2px; font-size: 18px; font-weight: 700; }
.search { position: relative; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-muted); width: 15px; height: 15px; }
.search input { padding-left: 32px; }
.search-results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 60; border-radius: 14px; padding: 6px; display: none; max-height: 320px; overflow: auto; }
.search-results.open { display: block; }
.search-results button { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 1px; padding: 8px 10px; border: 0; background: transparent; border-radius: 9px; }
.search-results button:hover { background: var(--row-hover); }
.search-results small { color: var(--text-muted); font-size: 11px; }
.nav { display: flex; flex-direction: column; gap: 2px; overflow: auto; }
.nav-group { font-size: 10.5px; font-weight: 700; letter-spacing: .8px; text-transform: uppercase; color: var(--text-muted); padding: 12px 10px 4px; }
.nav button {
  display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 11px; border: 0;
  background: transparent; text-align: left; font-weight: 500; color: var(--text-main); position: relative;
}
.nav button:hover { background: var(--row-hover); }
.nav button.active { background: var(--brand-gradient); color: #fff; box-shadow: 0 6px 18px rgba(0,100,214,.28); }
.nav button.active svg { color: #fff; }
.nav button svg { color: var(--text-muted); }
.company-card { margin-top: auto; border-radius: 14px; padding: 12px; background: var(--field-bg); border: 1px solid var(--glass-border); display: grid; gap: 6px; font-size: 12px; }
.company-card .kv { display: flex; justify-content: space-between; gap: 8px; }
.company-card .kv span:first-child { color: var(--text-muted); }
.company-card .mono { font-family: Consolas, monospace; }

/* ===== Page header ===== */
.main { min-width: 0; display: flex; flex-direction: column; gap: 18px; }
.page-head { display: flex; align-items: center; gap: 14px; padding: 4px 4px 0; }
.page-icon { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; background: var(--brand-gradient); color: #fff; box-shadow: 0 8px 22px rgba(0,100,214,.3); }
.page-icon svg { width: 22px; height: 22px; }
.page-head h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.2px; }
.page-head p { margin: 2px 0 0; color: var(--text-muted); font-size: 13px; }
.page-head .spacer { flex: 1; }
.save-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 7px 12px; border-radius: 999px; background: var(--success-soft); color: var(--success); transition: all .2s; }
.save-pill.saving { background: var(--brand-soft); color: var(--brand-strong); }
.save-pill svg { width: 14px; height: 14px; }

/* ===== Cards ===== */
.grid { display: grid; gap: 18px; }
.grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.span-2 { grid-column: span 2; }
.card { border-radius: 20px; overflow: hidden; }
.card-head { display: flex; align-items: flex-start; gap: 12px; padding: 16px 18px 12px; }
.card-head .ci { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--brand-soft); color: var(--brand-strong); flex-shrink: 0; }
.card-head h2 { margin: 0; font-size: 15px; font-weight: 650; }
.card-head p { margin: 2px 0 0; color: var(--text-muted); font-size: 12.5px; line-height: 1.45; }
.card-head .grow { flex: 1; min-width: 0; }
.card-body { padding: 4px 18px 18px; }
.moved-tag { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: rgba(124,108,240,.14); color: #6b5ce0; margin-left: 6px; vertical-align: 2px; }
:root[data-theme="dark"] .moved-tag { color: #b4a9ff; }

/* Setting rows: label + hint on the left, control on the right */
.srow { display: grid; grid-template-columns: minmax(180px, 280px) 1fr; gap: 18px; align-items: center; padding: 14px 0; border-top: 1px solid var(--glass-border); }
.srow:first-child { border-top: 0; }
.srow .lbl { font-weight: 600; }
.srow .hint { color: var(--text-muted); font-size: 12px; margin-top: 3px; line-height: 1.45; }
.srow .ctl { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-width: 0; }
.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 30% { background: var(--brand-soft); } 100% { background: transparent; } }

/* ===== Fields (glass) ===== */
.field {
  height: 38px; width: 100%; max-width: 360px; padding: 0 12px; border-radius: 11px;
  border: 1px solid var(--field-border); background: var(--field-bg); outline: none;
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  transition: border-color .15s, box-shadow .15s;
}
.field:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
textarea.field { height: auto; padding: 10px 12px; resize: vertical; max-width: none; line-height: 1.45; }
.field.sm { height: 32px; border-radius: 9px; font-size: 12.5px; }
.field.num { width: 76px; text-align: center; }
.with-suffix { position: relative; display: inline-flex; align-items: center; }
.with-suffix .field { padding-right: 34px; }
.with-suffix .sfx { position: absolute; right: 10px; color: var(--text-muted); font-size: 12px; pointer-events: none; }
.with-prefix { position: relative; display: inline-flex; align-items: center; }
.with-prefix .field { padding-left: 24px; }
.with-prefix .pfx { position: absolute; left: 10px; color: var(--text-muted); font-size: 12px; pointer-events: none; }
.readonly-field { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px dashed var(--field-border); color: var(--text-muted); max-width: 520px; width: 100%; font-family: Consolas, monospace; font-size: 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 11px; border: 1px solid var(--field-border); background: var(--field-bg); font-weight: 600; font-size: 12.5px; white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--brand-gradient); color: #fff; border-color: transparent; box-shadow: 0 6px 16px rgba(0,100,214,.25); }
.btn.danger { background: var(--danger-gradient); color: #fff; border-color: transparent; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--brand-strong); padding: 0 8px; }
.btn.sm { height: 30px; padding: 0 10px; border-radius: 9px; font-size: 12px; }
.btn svg { width: 15px; height: 15px; }
.x-btn { width: 28px; height: 28px; border-radius: 8px; border: 0; background: transparent; color: var(--text-muted); display: inline-grid; place-items: center; flex-shrink: 0; }
.x-btn:hover { background: var(--danger-soft); color: var(--danger); }
.x-btn svg { width: 15px; height: 15px; }

/* Toggle switch */
.switch { position: relative; width: 44px; height: 26px; border-radius: 999px; border: 0; background: rgba(120,120,128,.32); transition: background .2s; flex-shrink: 0; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.22); transition: transform .22s cubic-bezier(.34,1.56,.64,1); }
.switch.on { background: var(--brand-gradient); }
.switch.on::after { transform: translateX(18px); }
.switch.sm { width: 36px; height: 22px; }
.switch.sm::after { width: 16px; height: 16px; }
.switch.sm.on::after { transform: translateX(14px); }

/* Segmented control */
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--field-bg); border: 1px solid var(--field-border); position: relative; }
.seg button { position: relative; z-index: 1; border: 0; background: transparent; padding: 0 14px; height: 30px; border-radius: 9px; font-weight: 600; font-size: 12.5px; color: var(--text-muted); transition: color .2s; }
.seg button.on { color: var(--text-main); }
.seg .thumb { position: absolute; top: 3px; bottom: 3px; border-radius: 9px; background: var(--panel-bg); box-shadow: 0 1px 4px rgba(0,0,0,.12); transition: left .25s cubic-bezier(.32,.72,0,1), width .25s cubic-bezier(.32,.72,0,1); }
.seg.sm button { height: 26px; padding: 0 10px; font-size: 12px; }

/* Glass dropdown trigger + menu (same look as components/glass-dropdown.tsx) */
.gdd { height: 38px; min-width: 180px; max-width: 360px; width: 100%; padding: 0 10px 0 12px; border-radius: 11px; border: 1px solid var(--field-border); background: var(--field-bg); display: inline-flex; align-items: center; gap: 8px; text-align: left; -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
.gdd .val { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gdd svg { color: var(--text-muted); transition: transform .2s; }
.gdd.open svg.chev { transform: rotate(180deg); }
.gdd.sm { height: 32px; min-width: 0; border-radius: 9px; font-size: 12.5px; }
.gdd.pill { border-radius: 999px; height: 28px; font-weight: 600; font-size: 12px; min-width: 0; width: auto; padding: 0 10px; border: 0; color: #fff; }
.gdd.pill svg { color: inherit; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); }
.gmenu {
  position: fixed; z-index: 3000; border-radius: 14px; padding: 6px; min-width: 180px; max-height: 320px; overflow: auto;
  background: var(--glass-bg-strong); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(24px) saturate(180%); backdrop-filter: blur(24px) saturate(180%);
  box-shadow: var(--shadow-glass), 0 18px 40px rgba(15,23,42,.18);
  transform-origin: top center; animation: pop-in .22s cubic-bezier(.34,1.56,.64,1);
}
.gmenu.closing { animation: pop-out .15s ease-in forwards; }
.gmenu button { width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 10px; border: 0; border-radius: 9px; background: transparent; text-align: left; font-size: 13px; }
.gmenu button:hover, .gmenu button:focus-visible { background: var(--row-hover); outline: none; }
.gmenu button.sel { font-weight: 650; }
.gmenu button .chk { margin-left: auto; color: var(--brand); }
.gmenu .sub { margin-left: auto; color: var(--text-muted); font-size: 11.5px; }
@keyframes pop-in { from { opacity: 0; transform: scale(.92) translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes pop-out { to { opacity: 0; transform: scale(.95); } }

/* Glass modal */
.modal-wrap { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(15,23,42,.16); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); animation: fade .2s ease-out; }
.modal-wrap.closing .modal-backdrop { animation: fade-out .2s ease-in forwards; }
.modal {
  position: relative; width: 100%; max-width: 560px; max-height: calc(100vh - 32px); display: flex; flex-direction: column;
  border-radius: 20px; border: 1px solid var(--glass-border); background: var(--glass-modal-bg);
  -webkit-backdrop-filter: blur(16px) saturate(220%); backdrop-filter: blur(16px) saturate(220%);
  box-shadow: inset 0 1px 0 var(--sheen), var(--shadow-glass), 0 24px 60px rgba(15,23,42,.25);
  animation: modal-in .34s cubic-bezier(.34,1.56,.64,1);
}
.modal-wrap.closing .modal { animation: modal-out .2s ease-in forwards; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--glass-border); background: rgba(15,23,42,.025); border-radius: 20px 20px 0 0; }
.modal-head h3 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; flex: 1; }
.modal-body { padding: 16px; overflow: auto; display: grid; gap: 14px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--glass-border); }
.modal label.f { display: grid; gap: 6px; font-weight: 600; font-size: 12px; }
.modal .field { max-width: none; }
.modal .gdd { max-width: none; }
@keyframes fade { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes modal-in { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
@keyframes modal-out { to { opacity: 0; transform: scale(.85); } }
.section-label { font-size: 10.5px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }

/* ===== Lists (rows) ===== */
.list { display: flex; flex-direction: column; gap: 6px; }
.lrow {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 12px;
  background: var(--field-bg); border: 1px solid var(--glass-border);
  transition: transform .2s cubic-bezier(.32,.72,0,1), opacity .2s, background .15s;
}
.lrow:hover { background: color-mix(in srgb, var(--field-bg) 70%, var(--row-hover)); }
.lrow .grow { flex: 1; min-width: 0; }
.lrow .field { max-width: none; height: 32px; border-color: transparent; background: transparent; padding: 0 8px; border-radius: 8px; backdrop-filter: none; }
.lrow .field:hover { border-color: var(--field-border); }
.lrow .field:focus { border-color: var(--brand); background: var(--panel-bg); }
.grip { width: 24px; height: 28px; display: inline-grid; place-items: center; color: var(--text-muted); cursor: grab; border-radius: 7px; flex-shrink: 0; touch-action: none; }
.grip:hover { background: var(--row-hover); color: var(--text-main); }
.grip svg { width: 15px; height: 15px; }
.lrow.dragging { opacity: .25; }
.drop-slot { height: 4px; border-radius: 4px; background: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 22%, transparent); margin: -1px 6px; }
.count-pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--row-hover); color: var(--text-muted); white-space: nowrap; }
.add-row { margin-top: 10px; }
.tinted-row { border: 0; color: #fff; }
.tinted-row .field { color: #fff; }
.tinted-row .field::placeholder { color: rgba(255,255,255,.7); }
.tinted-row .grip, .tinted-row .x-btn, .tinted-row .chev-btn { color: rgba(255,255,255,.85); }
.tinted-row .field:focus { background: rgba(255,255,255,.18); border-color: rgba(255,255,255,.6); }
.chev-btn { width: 28px; height: 28px; border: 0; background: transparent; border-radius: 8px; color: var(--text-muted); display: inline-grid; place-items: center; }
.chev-btn svg { transition: transform .22s; }
.chev-btn.open svg { transform: rotate(180deg); }
.nested { margin: 4px 0 4px 34px; padding: 10px; border-radius: 12px; border: 1px dashed var(--field-border); display: grid; gap: 6px; }
.nested .hint { color: var(--text-muted); font-size: 11.5px; }
.default-radio { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); white-space: nowrap; border: 0; background: transparent; }
.default-radio .r { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--field-border); display: grid; place-items: center; }
.default-radio.on { color: var(--brand-strong); font-weight: 600; }
.default-radio.on .r { border-color: var(--brand); }
.default-radio.on .r::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--brand); }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 6px 0 12px; border-radius: 999px; background: var(--field-bg); border: 1px solid var(--glass-border); font-weight: 600; font-size: 12.5px; }
.chip button { width: 20px; height: 20px; border: 0; border-radius: 50%; background: transparent; color: var(--text-muted); display: grid; place-items: center; }
.chip button:hover { background: var(--danger-soft); color: var(--danger); }
.chip button svg { width: 12px; height: 12px; }
.chip-add { display: inline-flex; align-items: center; gap: 4px; height: 30px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--field-border); background: transparent; color: var(--brand-strong); font-weight: 600; font-size: 12.5px; }

/* Colour circle picker */
.swatch-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--panel-bg); box-shadow: 0 0 0 1px var(--field-border), 0 2px 6px rgba(0,0,0,.12); flex-shrink: 0; padding: 0; transition: transform .15s; }
.swatch-btn:hover { transform: scale(1.08); }
.swatch-btn.lg { width: 40px; height: 40px; }
.palette { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.palette .p { width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); transition: transform .15s; }
.palette .p:hover { transform: scale(1.1); }
.palette .p.on::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid var(--text-main); }

.table { width: 100%; border-collapse: separate; border-spacing: 0 6px; }

.tile { text-align: left; border-radius: 16px; padding: 14px; background: var(--field-bg); border: 1px solid var(--glass-border); display: grid; gap: 10px; transition: transform .15s, box-shadow .15s; }

/* Tabs inside a card */

@media (max-width: 1100px) { .grid.two { grid-template-columns: 1fr; } .span-2 { grid-column: auto; } }

let openMenu = null;

function optionsFor(id) {

  if (id === "retention") return RETENTION.map(([v, l]) => ({ value: v, label: l }));
  if (id === "pageSize") return ["A4", "A3", "Letter", "Legal"].map((v) => ({ value: v, label: v }));
  if (/^products\.\d+\.type$/.test(id)) return ["-", "Grain", "Lacquer (1 side)", "Lacquer (2 side)", "Melteca"].map((v) => ({ value: v, label: v === "-" ? "No type" : v }));
  if (/^partTypes\.\d+\.type$/.test(id)) return ["", "Cabinetry", "Drawer", "Doors", "Panels", "Extras"].map((v) => ({ value: v, label: v || "None" }));
  if (/^staff\.\d+\.role$/.test(id)) return S.roles.filter((r) => r.name !== "Owner").map((r) => ({ value: r.name, label: r.name, color: r.color }));
  if (id === "machineType") return ["CNC", "Table Saw", "Edge Bander", "Other"].map((v) => ({ value: v, label: v }));
  if (id === "useFor") return ["Not used", "Client Name", "Client First Name", "Client Last Name", "Client Phone", "Client Email", "Project Address", "Project Notes"].map((v) => ({ value: v, label: v }));
  if (id === "inviteRole") return S.roles.filter((r) => r.name !== "Owner").map((r) => ({ value: r.name, label: r.name, color: r.color }));
  if (id === "transferTo") return S.staff.slice(0, 3).map((p) => ({ value: p.name, label: p.name, color: p.color }));

}
function openDropdown(trigger) {
  if (openMenu && openMenu.trigger === trigger) return closeMenu();
  closeMenu();
  const id = trigger.dataset.dd; const value = trigger.dataset.value;
  const opts = optionsFor(id);
  const el = document.createElement("div");
  el.className = "gmenu";
  el.innerHTML = opts.map((o) => `<button data-v="${esc(o.value)}" class="${o.value === value ? "sel" : ""}">${o.color ? `<span class="dot" style="background:${o.color}"></span>` : ""}<span>${esc(o.label)}</span>${o.sub ? `<span class="sub">${esc(o.sub)}</span>` : ""}${o.value === value ? `<span class="chk">${icon("check")}</span>` : ""}</button>`).join("");
  document.body.appendChild(el);
  const r = trigger.getBoundingClientRect();
  el.style.minWidth = Math.max(r.width, 180) + "px";
  const h = el.offsetHeight;
  const below = r.bottom + 6 + h < innerHeight;
  el.style.left = Math.min(r.left, innerWidth - el.offsetWidth - 8) + "px";
  el.style.top = (below ? r.bottom + 6 : r.top - 6 - h) + "px";
  el.style.transformOrigin = below ? "top center" : "bottom center";
  trigger.classList.add("open");
  openMenu = { el, trigger };

  el.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-v]"); if (!b) return;

    if (id === "currency") S.currency = v;

/* ===================================================================================== */
/* Drag to reorder — same "grab and swing" ghost as the Leads / Dashboard kanban          */
/* ===================================================================================== */
let drag = null;
let lastDragEnd = 0; // the click that ends a drag shouldn't also open the row
function startDrag(e, gripEl) {
  const row = gripEl.closest("[data-row]"); const list = row && row.parentElement;
  if (!row || !list || !list.dataset.list) return;
  e.preventDefault();
  const rect = row.getBoundingClientRect();
  const ghost = document.createElement("div");
  ghost.className = "drag-ghost";
  ghost.innerHTML = `<span class="dot" style="background:${row.dataset.color || "#7D99B3"};width:10px;height:10px"></span><span>${esc(row.dataset.label || "Row")}</span>`;
  document.body.appendChild(ghost);
  // Pick-up: grow out of the row's own box, then settle onto the pointer with a springy pop.
  const nat = ghost.getBoundingClientRect();
  ghost.style.transformOrigin = "top left";
  ghost.style.transform = `translate(${rect.left}px, ${rect.top}px) scale(${rect.width / nat.width}, ${rect.height / nat.height})`;
  requestAnimationFrame(() => {
    ghost.style.transition = "transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1)";
    ghost.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, 6px) scale(1)`;
    setTimeout(() => { ghost.style.transition = "none"; ghost.style.transformOrigin = "center"; }, 230);
  });
  row.classList.add("dragging");
  const slot = document.createElement("div"); slot.className = "drop-slot";
  drag = { row, list, ghost, slot, lastX: e.clientX, index: [...list.children].filter((c) => c.dataset.row).indexOf(row) };
  document.body.style.cursor = "grabbing";
}

  if (!drag) return;
  const { ghost, list, slot } = drag;
  const dx = e.clientX - drag.lastX; drag.lastX = e.clientX;
  const rot = Math.max(-18, Math.min(18, dx * 1.6));
  if (ghost.style.transition === "none" || !ghost.style.transition) ghost.style.transform = `translate(${e.clientX}px, ${e.clientY}px) translate(-50%, 6px) rotate(${rot}deg)`;
  const rows = [...list.children].filter((c) => c.dataset.row && c !== drag.row);
  let before = null;
  for (const r of rows) { const b = r.getBoundingClientRect(); if (e.clientY < b.top + b.height / 2) { before = r; break; } }
  if (before) list.insertBefore(slot, before); else list.appendChild(slot);
}
function endDrag() {
  if (!drag) return;
  const { row, list, ghost, slot } = drag;
  const key = list.dataset.list;
  const arr = getPath(key);
  const rows = [...list.children].filter((c) => c.dataset.row || c === slot);
  let to = rows.filter((c) => c !== row).indexOf(slot);
  const from = drag.index;
  ghost.style.transition = "opacity 150ms ease-out"; ghost.style.opacity = "0"; setTimeout(() => ghost.remove(), 160);
  slot.remove(); row.classList.remove("dragging"); document.body.style.cursor = "";
  drag = null; lastDragEnd = Date.now();
  if (Array.isArray(arr) && to > -1 && to !== from) {
    const [item] = arr.splice(from, 1); arr.splice(to, 0, item);
    touched(); render();
  } else if (!Array.isArray(arr) && to > -1 && to !== from) {
    // Demo lists that aren't backed by state (inside modals): move the DOM row.
    const siblings = [...list.children].filter((c) => c.dataset.row && c !== row);
    list.insertBefore(row, siblings[to] || null); touched();
  }
}

/* ===================================================================================== */
/* Events                                                                                */
/* ===================================================================================== */
document.addEventListener("pointerdown", (e) => {
  const g = e.target.closest("[data-grip]"); if (g) return startDrag(e, g);
  if (openMenu && !e.target.closest(".gmenu") && !e.target.closest(".gdd")) closeMenu();
  if (openPop && !e.target.closest(".cpop") && !e.target.closest("[data-color]")) closePop();
  if (!e.target.closest(".search")) $("#searchResults").classList.remove("open");
});
document.addEventListener("pointermove", moveDrag);
document.addEventListener("pointerup", endDrag);
document.addEventListener("click", (e) => {
  const t = e.target;
  if (Date.now() - lastDragEnd < 250) return;
  const tab = t.closest("[data-tab]"); if (tab) { S.tab = tab.dataset.tab; closeMenu(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
  const ddb = t.closest("[data-dd]"); if (ddb) { e.stopPropagation(); return openDropdown(ddb); }
  const col = t.closest("[data-color]"); if (col && !t.closest("[data-row]")?.dataset.dragging) { e.stopPropagation(); return openColor(col); }
  const pick = t.closest("[data-theme-pick]"); if (pick) { S.theme = pick.dataset.themePick; touched(); return render(); }
  const tg = t.closest("[data-toggle]"); if (tg) { tg.classList.toggle("on"); const p = tg.dataset.toggle; if (p) { setPath(p, tg.classList.contains("on")); touched(); if (["discountOn", "zapierOn"].includes(p)) render(); } else touched(); return; }
  const sg = t.closest(".seg button"); if (sg) {
    const wrap = sg.parentElement; wrap.querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === sg)); layoutSegs();
    const id = wrap.dataset.seg; touched();
    if (id === "unit") { S.unit = sg.dataset.v; render(); toast(`Measurements now show in ${S.unit === "mm" ? "millimetres" : "inches"} — e.g. ${length(600)}`); }
    else if (id && id.includes(".")) setPath(id, sg.dataset.v);
    return;
  }
  const op = t.closest("[data-open]"); if (op && !op.disabled) { const o = getPath(op.dataset.open); o.open = !o.open; return render(); }
  const def = t.closest("[data-default]"); if (def) {
    const p = def.dataset.default; const parts = p.split("."); const idx = Number(parts.pop()); const arr = getPath(parts.join("."));
    arr.forEach((x, k) => (x.def = k === idx)); touched(); return render();
  }
  const del = t.closest("[data-del]"); if (del && del.dataset.del) {
    const parts = del.dataset.del.split("."); const idx = Number(parts.pop()); const arr = getPath(parts.join("."));
    if (Array.isArray(arr)) { arr.splice(idx, 1); touched(); render(); }
    return;
  }
  const add = t.closest("[data-add]"); if (add) {
    const arr = getPath(add.dataset.add);
    const key = add.dataset.add.split(".").pop();
    const blank = { projectStatuses: { name: "New status", color: "#64748B", subs: [] }, subs: { name: "", color: "#64748B", def: false }, products: { name: "New product", type: "-", sizes: 1, sales: true },
      tiers: { low: 0, high: 0, pct: 0 }, helpers: "", partTypes: { name: "New part", color: "#7D99B3", type: "", a1: "1L", a2: "1S", im: false, cut: true, nest: true },
      sheetSizes: { h: 2440, w: 1220, def: false }, hardware: { name: "New brand", color: "#7D99B3", def: false }, roles: { name: "New role", color: "#7D99B3", locked: false } }[key] || { name: "", color: S.theme };
    arr.push(typeof blank === "object" ? JSON.parse(JSON.stringify(blank)) : blank); touched(); render();
    setTimeout(() => { const inputs = document.querySelectorAll(`[data-list="${add.dataset.add}"] .lrow:last-child input`); inputs[0]?.focus(); }, 0);
    return;
  }
  if (t.closest("[data-add-tag]")) { S.tags.push({ name: "New tag", count: 0 }); touched(); return render(); }
  if (t.closest("[data-add-contractor]")) { S.contractors.push("New trade"); touched(); return render(); }
  const mo = t.closest("[data-modal]"); if (mo) return MODALS[mo.dataset.modal](e);
  const ma = t.closest("[data-machine]"); if (ma) return machineModal(Number(ma.dataset.machine), e);
  const ro = t.closest("[data-role]"); if (ro && !t.closest("[data-grip]")) return roleModal(Number(ro.dataset.role), e);
  const ts = t.closest("[data-toast]"); if (ts) return toast(ts.dataset.toast);
  if (t.closest("[data-copy]")) return toast("Webhook URL copied");
  const rg = t.closest("[data-regen]"); if (rg) { if (rg.dataset.armed) { toast("New webhook URL generated"); delete rg.dataset.armed; rg.innerHTML = `${icon("refresh-cw")} Regenerate URL`; } else { rg.dataset.armed = "1"; rg.innerHTML = `${icon("alert-triangle")} Click again to confirm`; } icons(); return; }
});
document.addEventListener("input", (e) => {
  const b = e.target.closest("[data-bind]"); if (!b) return;
  setPath(b.dataset.bind, b.value); touched();
  if (b.dataset.bind === "companyName") { $("#ccName").textContent = b.value || "Company"; const art = document.querySelector(".logo-art"); if (art) art.lastChild.textContent = (b.value || "Company").split(" ")[0]; }
  const row = b.closest("[data-row]"); if (row) row.dataset.label = b.value;
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeMenu(); closePop(); const m = document.querySelector(".modal-wrap:last-of-type"); if (m) m.querySelector("[data-close]")?.click(); }
});
$("#themeBtn").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("#themeBtn").innerHTML = icon(dark ? "sun" : "moon"); icons();
});
$("#joinKeyBtn").addEventListener("click", (e) => {
  const k = $("#joinKey"); const show = k.textContent.startsWith("•");
  k.textContent = show ? "HJ-4821" : "••••••"; e.target.textContent = show ? "Hide" : "Show";
});

/* Search: every setting row / card across all tabs */
function searchIndex() {
  const out = [];
  const holder = document.createElement("div");
  for (const t of TABS.filter((x) => x.key)) {
    holder.innerHTML = VIEWS[t.key]();
    holder.querySelectorAll(".card").forEach((c) => {
      const title = c.querySelector("h2")?.childNodes[0]?.textContent || "";
      out.push({ tab: t.key, tabLabel: t.label, label: title, sid: null, title });
      c.querySelectorAll(".srow").forEach((r) => out.push({ tab: t.key, tabLabel: t.label, label: r.querySelector(".lbl").textContent, sid: r.dataset.sid, title }));
    });
  }
  return out;
}
let INDEX = null;
$("#search").addEventListener("input", (e) => {
  INDEX = INDEX || searchIndex();
  const q = e.target.value.trim().toLowerCase(); const box = $("#searchResults");
  if (!q) { box.classList.remove("open"); return; }
  const hits = INDEX.filter((x) => x.label.toLowerCase().includes(q) || x.tabLabel.toLowerCase().includes(q)).slice(0, 12);
  box.innerHTML = hits.length ? hits.map((h, i) => `<button data-hit="${i}"><span>${esc(h.label)}</span><small>${esc(h.tabLabel)}${h.sid ? " › " + esc(h.title) : ""}</small></button>`).join("") : `<div style="padding:10px;color:var(--text-muted)">No settings match “${esc(q)}”</div>`;
  box.classList.add("open");
  box.onclick = (ev) => {
    const b = ev.target.closest("[data-hit]"); if (!b) return; const h = hits[Number(b.dataset.hit)];
    S.tab = h.tab; render(); box.classList.remove("open"); $("#search").value = "";
    const target = h.sid ? document.querySelector(`[data-sid="${h.sid}"]`) : [...document.querySelectorAll(".card h2")].find((x) => x.textContent.startsWith(h.title))?.closest(".card");
    if (target) { target.scrollIntoView({ behavior: "smooth", block: "center" }); target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 1700); }
  };
});

window.addEventListener("resize", layoutSegs);
render();
</script>
