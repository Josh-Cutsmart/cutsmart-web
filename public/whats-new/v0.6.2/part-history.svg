<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A shelf's History lists each earlier version of the part, newest first, with when it changed, who changed it and what changed picked out in amber; Restore on yesterday's puts the part back as it was then</title>
  <style>
    .show { animation: show 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes show { 0%, 2% { opacity: 0; transform: translateY(10px); } 7%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .row1 { animation: row1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes row1 { 0%, 7% { opacity: 0; transform: translateY(6px); } 12%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .row2 { animation: row2 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes row2 { 0%, 11% { opacity: 0; transform: translateY(6px); } 16%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .row3 { animation: row3 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes row3 { 0%, 15% { opacity: 0; transform: translateY(6px); } 20%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .cur { animation: cur 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes cur { 0%, 18% { opacity: 0; transform: translate(420px, 330px); } 21% { opacity: 1; transform: translate(420px, 330px); } 34%, 41% { opacity: 1; transform: translate(552px, 156px); } 52% { opacity: 1; transform: translate(500px, 250px); } 56%, 100% { opacity: 0; transform: translate(500px, 250px); } }
    .press { animation: press 8s ease infinite both; }
    @keyframes press { 0%, 37% { opacity: 0; } 39%, 42% { opacity: 1; } 45%, 100% { opacity: 0; } }
    .rip { animation: rip 8s ease-out infinite both; }
    @keyframes rip { 0%, 39% { opacity: 0; } 40% { opacity: .55; } 45%, 100% { opacity: 0; } }
    .done { animation: done 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes done { 0%, 43% { opacity: 0; transform: translateY(4px); } 48%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .old { animation: old 8s ease infinite both; }
    @keyframes old { 0%, 2% { opacity: 0; } 7%, 44% { opacity: 1; } 47%, 100% { opacity: 0; } }
    .new { animation: new 8s ease infinite both; }
    @keyframes new { 0%, 45% { opacity: 0; } 49%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .flash { animation: flash 8s ease infinite both; }
    @keyframes flash { 0%, 45% { opacity: 0; } 49%, 62% { opacity: 1; } 74%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <g class="show">
    <rect x="32" y="20" width="576" height="248" rx="16" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="52" y="47" font-size="13" font-weight="600" fill="#0F172A">History</text>
    <text x="110" y="47" font-size="11.5" font-weight="500" fill="#64748B">Shelf · Pantry shelf</text>
    <path d="M582 37 L592 47 M592 37 L582 47" stroke="#94A3B8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="56" y="74" font-size="10" font-weight="700" fill="#94A3B8">Changed</text>
    <text x="214" y="74" font-size="10" font-weight="700" fill="#94A3B8">Height</text>
    <text x="272" y="74" font-size="10" font-weight="700" fill="#94A3B8">Width</text>
    <text x="330" y="74" font-size="10" font-weight="700" fill="#94A3B8">Depth</text>
    <text x="388" y="74" font-size="10" font-weight="700" fill="#94A3B8">Qty</text>
    <text x="432" y="74" font-size="10" font-weight="700" fill="#94A3B8">Board</text>
  </g>

  <g class="row1">
    <rect x="44" y="84" width="552" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="56" y="105" font-size="11.5" font-weight="600" fill="#0F172A">2:41 pm</text><text x="56" y="122" font-size="10.5" font-weight="500" fill="#64748B">Alex</text>
    <rect x="207" y="96" width="40" height="22" rx="6" fill="#FEF3C7"/><text x="214" y="111.5" font-size="11.5" font-weight="600" fill="#92400E">580</text>
    <text x="272" y="111.5" font-size="11.5" font-weight="500" fill="#334155">540</text><text x="330" y="111.5" font-size="11.5" font-weight="500" fill="#334155">18</text><text x="388" y="111.5" font-size="11.5" font-weight="500" fill="#334155">4</text>
    <text x="432" y="111.5" font-size="11.5" font-weight="500" fill="#334155">Chalk White</text>
    <rect x="520" y="97" width="66" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="553" y="113" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Restore</text>
  </g>
  <g class="row2">
    <rect x="44" y="142" width="552" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="56" y="163" font-size="11.5" font-weight="600" fill="#0F172A">Yesterday 4:05 pm</text><text x="56" y="180" font-size="10.5" font-weight="500" fill="#64748B">Sam</text>
    <text x="214" y="169.5" font-size="11.5" font-weight="500" fill="#334155">580</text>
    <rect x="265" y="154" width="40" height="22" rx="6" fill="#FEF3C7"/><text x="272" y="169.5" font-size="11.5" font-weight="600" fill="#92400E">520</text>
    <text x="330" y="169.5" font-size="11.5" font-weight="500" fill="#334155">18</text><text x="388" y="169.5" font-size="11.5" font-weight="500" fill="#334155">4</text>
    <text x="432" y="169.5" font-size="11.5" font-weight="500" fill="#334155">Chalk White</text>
    <rect x="520" y="155" width="66" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="553" y="171" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Restore</text>
  </g>
  <g class="press"><rect x="520" y="155" width="66" height="24" rx="12" fill="#2563EB"/><text x="553" y="171" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFFFFF">Restore</text></g>
  <g class="row3">
    <rect x="44" y="200" width="552" height="50" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="56" y="221" font-size="11.5" font-weight="600" fill="#0F172A">Mon 9:12 am</text><text x="56" y="238" font-size="10.5" font-weight="500" fill="#64748B">Alex</text>
    <text x="214" y="227.5" font-size="11.5" font-weight="500" fill="#334155">580</text><text x="272" y="227.5" font-size="11.5" font-weight="500" fill="#334155">520</text><text x="330" y="227.5" font-size="11.5" font-weight="500" fill="#334155">18</text>
    <rect x="381" y="212" width="28" height="22" rx="6" fill="#FEF3C7"/><text x="388" y="227.5" font-size="11.5" font-weight="600" fill="#92400E">2</text>
    <text x="432" y="227.5" font-size="11.5" font-weight="500" fill="#334155">Chalk White</text>
    <rect x="520" y="213" width="66" height="24" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/><text x="553" y="229" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Restore</text>
  </g>
  <g class="done">
    <rect x="404" y="31" width="164" height="22" rx="11" fill="#F0FDF4" stroke="#BBF7D0"/>
    <circle cx="418" cy="42" r="6" fill="#16A34A"/><path d="M415.2 42 L417.4 44.2 L421 39.8" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="430" y="46" font-size="10.5" font-weight="600" fill="#15803D">Restored ·</text><text x="490" y="46" font-size="10.5" font-weight="700" fill="#2563EB">Undo</text>
  </g>

  <g class="show">
    <rect x="32" y="282" width="576" height="56" rx="14" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="52" y="305" font-size="10" font-weight="700" fill="#94A3B8">Cutlist List</text>
    <rect x="52" y="312" width="52" height="18" rx="9" fill="#E0E7FF"/><text x="78" y="325" text-anchor="middle" font-size="10" font-weight="600" fill="#3730A3">Shelf</text>
    <text x="114" y="325" font-size="11.5" font-weight="500" fill="#334155">Pantry shelf</text>
    <text x="330" y="325" font-size="11.5" font-weight="500" fill="#334155">18</text><text x="388" y="325" font-size="11.5" font-weight="500" fill="#334155">4</text>
    <text x="432" y="325" font-size="11.5" font-weight="500" fill="#334155">Chalk White 18mm</text>
    <text x="214" y="305" font-size="10" font-weight="700" fill="#94A3B8">Height</text><text x="272" y="305" font-size="10" font-weight="700" fill="#94A3B8">Width</text>
  </g>
  <g class="flash"><rect x="207" y="311" width="98" height="20" rx="6" fill="#DBEAFE"/></g>
  <g class="old"><text x="214" y="325" font-size="11.5" font-weight="500" fill="#334155">600</text><text x="272" y="325" font-size="11.5" font-weight="500" fill="#334155">540</text></g>
  <g class="new"><text x="214" y="325" font-size="11.5" font-weight="600" fill="#1E40AF">580</text><text x="272" y="325" font-size="11.5" font-weight="600" fill="#1E40AF">520</text></g>

  <g class="rip"><circle cx="553" cy="167" r="13" fill="none" stroke="#2563EB" stroke-width="2"/></g>
  <g class="cur"><path d="M0 0 L0 17 L4.6 12.6 L7.6 19.4 L10.4 18.2 L7.4 11.6 L13.4 11.6 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/></g>
</svg>
