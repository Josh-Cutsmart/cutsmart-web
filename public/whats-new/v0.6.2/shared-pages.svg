<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Notes typed into a project's General page with no signal are saved on the device; when it's back online the Saved bar shows who else is on the page, and Liam's change to the install date appears live</title>
  <style>
    .show { animation: show 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes show { 0%, 2% { opacity: 0; transform: translateY(10px); } 7%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .off { animation: off 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes off { 0%, 6% { opacity: 0; transform: translateY(-4px); } 10%, 45% { opacity: 1; transform: translateY(0); } 48%, 100% { opacity: 0; transform: translateY(0); } }
    .on { animation: on 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes on { 0%, 46% { opacity: 0; transform: translateY(-4px); } 50%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .type1 { transform-box: fill-box; transform-origin: 100% 50%; animation: type1 8s linear infinite both; }
    @keyframes type1 { 0%, 12% { transform: scaleX(1); } 24%, 100% { transform: scaleX(0); } }
    .type2 { transform-box: fill-box; transform-origin: 100% 50%; animation: type2 8s linear infinite both; }
    @keyframes type2 { 0%, 25% { transform: scaleX(1); } 33%, 100% { transform: scaleX(0); } }
    .txt { animation: txt 8s ease infinite both; }
    @keyframes txt { 0%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .caret { animation: caret 8s steps(1) infinite both; }
    @keyframes caret { 0%, 33% { opacity: 0; } 34% { opacity: 1; } 37% { opacity: 0; } 40% { opacity: 1; } 43% { opacity: 0; } 46%, 100% { opacity: 0; } }
    .local { animation: local 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes local { 0%, 33% { opacity: 0; transform: translateY(10px); } 37%, 46% { opacity: 1; transform: translateY(0); } 49%, 100% { opacity: 0; transform: translateY(0); } }
    .saved { animation: saved 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes saved { 0%, 48% { opacity: 0; transform: translateY(10px); } 52%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .who { animation: who 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes who { 0%, 53% { opacity: 0; transform: translateX(-6px); } 57%, 92% { opacity: 1; transform: translateX(0); } 96%, 100% { opacity: 0; transform: translateX(0); } }
    .live { animation: live 8s ease infinite both; }
    @keyframes live { 0%, 61% { opacity: 0; } 64%, 84% { opacity: 1; } 88%, 100% { opacity: 0; } }
    .flag { animation: flag 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes flag { 0%, 61% { opacity: 0; transform: translateY(4px); } 64%, 84% { opacity: 1; transform: translateY(0); } 88%, 100% { opacity: 0; transform: translateY(0); } }
    .old { animation: old 8s ease infinite both; }
    @keyframes old { 0%, 2% { opacity: 0; } 7%, 66% { opacity: 1; } 68%, 100% { opacity: 0; } }
    .new { animation: new 8s ease infinite both; }
    @keyframes new { 0%, 67% { opacity: 0; } 70%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <g class="show">
    <rect x="24" y="22" width="592" height="268" rx="16" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="44" y="52" font-size="14" font-weight="700" fill="#0F172A">Smith Kitchen</text>
    <rect x="44" y="64" width="72" height="24" rx="12" fill="#EFF6FF"/><text x="80" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">General</text>
    <text x="144" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">Design</text>
    <text x="214" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">Production</text>
    <text x="290" y="80" text-anchor="middle" font-size="11" font-weight="600" fill="#64748B">Settings</text>
    <line x1="44" y1="98" x2="596" y2="98" stroke="#EEF2F7"/>

    <text x="44" y="122" font-size="10.5" font-weight="700" fill="#64748B">Client</text>
    <rect x="44" y="128" width="262" height="34" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="58" y="149.5" font-size="12" font-weight="500" fill="#0F172A">Daniel Smith</text>
    <text x="44" y="186" font-size="10.5" font-weight="700" fill="#64748B">Install date</text>
    <rect x="44" y="192" width="262" height="34" rx="9" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="44" y="250" font-size="10.5" font-weight="700" fill="#64748B">Status</text>
    <rect x="44" y="256" width="96" height="22" rx="11" fill="#EEF2FF"/><circle cx="58" cy="267" r="4" fill="#2563EB"/><text x="68" y="271" font-size="10.5" font-weight="600" fill="#0F172A">Production</text>

    <text x="334" y="122" font-size="10.5" font-weight="700" fill="#64748B">Notes</text>
    <rect x="334" y="128" width="262" height="98" rx="9" fill="#F8FAFC" stroke="#93C5FD" stroke-width="1.5"/>
  </g>
  <g class="old"><text x="58" y="213.5" font-size="12" font-weight="500" fill="#0F172A">28 Nov 2026</text></g>
  <g class="new"><text x="58" y="213.5" font-size="12" font-weight="600" fill="#1E40AF">3 Dec 2026</text></g>
  <g class="live"><rect x="44" y="192" width="262" height="34" rx="9" fill="none" stroke="#2563EB" stroke-width="2"/></g>
  <g class="flag"><rect x="254" y="180" width="46" height="18" rx="9" fill="#2563EB"/><text x="277" y="192.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">Liam</text></g>

  <g class="txt">
    <text x="348" y="152" font-size="12" font-weight="500" fill="#334155">Client wants soft-close drawers</text>
    <text x="348" y="172" font-size="12" font-weight="500" fill="#334155">and a pantry pull-out.</text>
  </g>
  <rect class="type1" x="346" y="139" width="200" height="18" fill="#F8FAFC"/>
  <rect class="type2" x="346" y="159" width="140" height="18" fill="#F8FAFC"/>
  <g class="caret"><rect x="474" y="161" width="1.6" height="15" fill="#2563EB"/></g>

  <g class="off">
    <rect x="504" y="36" width="92" height="26" rx="13" fill="#FFFBEB" stroke="#FDE68A"/>
    <path d="M518 51.5 Q523 46.5 528 51.5 M515 48 Q523 40.5 531 48" fill="none" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/><circle cx="523" cy="54.5" r="1.4" fill="#B45309"/><path d="M515 43 L531 57" stroke="#B45309" stroke-width="1.5" stroke-linecap="round"/>
    <text x="540" y="53.5" font-size="11" font-weight="600" fill="#92400E">Offline</text>
  </g>
  <g class="on">
    <rect x="504" y="36" width="92" height="26" rx="13" fill="#F0FDF4" stroke="#BBF7D0"/>
    <path d="M518 51.5 Q523 46.5 528 51.5 M515 48 Q523 40.5 531 48" fill="none" stroke="#15803D" stroke-width="1.5" stroke-linecap="round"/><circle cx="523" cy="54.5" r="1.4" fill="#15803D"/>
    <text x="540" y="53.5" font-size="11" font-weight="600" fill="#15803D">Online</text>
  </g>

  <g class="local">
    <rect x="364" y="302" width="252" height="40" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <rect x="384" y="312" width="12" height="20" rx="3" fill="none" stroke="#475569" stroke-width="1.5"/><line x1="388" y1="328" x2="392" y2="328" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>
    <text x="406" y="326" font-size="11.5" font-weight="600" fill="#0F172A">Saved on this device</text>
    <rect x="540" y="313" width="64" height="18" rx="9" fill="#FFFBEB" stroke="#FDE68A"/>
    <text x="572" y="325.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#92400E">to sync</text>
  </g>
  <g class="saved">
    <rect x="364" y="302" width="252" height="40" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <circle cx="390" cy="322" r="8" fill="#16A34A"/><path d="M386.2 322 L389 324.8 L394 319" fill="none" stroke="#FFFFFF" stroke-width="1.7"/>
    <text x="406" y="326" font-size="11.5" font-weight="600" fill="#0F172A">Saved</text>
    <line x1="456" y1="312" x2="456" y2="332" stroke="#E2E8F0"/>
  </g>
  <g class="who">
    <path d="M470 322 Q480 313 490 322 Q480 331 470 322 Z" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/><circle cx="480" cy="322" r="2.6" fill="#475569"/>
    <circle cx="508" cy="322" r="11" fill="#DB2777" stroke="#FFFFFF" stroke-width="1.5"/><text x="508" y="325.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">AM</text>
    <circle cx="526" cy="322" r="11" fill="#2563EB" stroke="#FFFFFF" stroke-width="1.5"/><text x="526" y="325.5" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">LC</text>
    <text x="544" y="326" font-size="10.5" font-weight="500" fill="#64748B">here now</text>
  </g>
</svg>
