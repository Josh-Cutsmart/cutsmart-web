<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A gable's top edge is right-clicked on its drawing, Black (1 × 22mm) is picked from the edge tape list, the edge turns black with its tape's name, and the Edge tape card totals the metres to order</title>
  <style>
    .show { animation: show 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes show { 0%, 2% { opacity: 0; transform: translateY(10px); } 7%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .cur { animation: cur 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes cur { 0%, 6% { opacity: 0; transform: translate(300px, 230px); } 9% { opacity: 1; transform: translate(300px, 230px); } 16%, 24% { opacity: 1; transform: translate(186px, 74px); } 31%, 38% { opacity: 1; transform: translate(236px, 151px); } 47% { opacity: 1; transform: translate(318px, 214px); } 51%, 100% { opacity: 0; transform: translate(318px, 214px); } }
    .rip1 { animation: rip1 8s ease-out infinite both; }
    @keyframes rip1 { 0%, 17% { opacity: 0; } 18% { opacity: .55; } 23%, 100% { opacity: 0; } }
    .rip2 { animation: rip2 8s ease-out infinite both; }
    @keyframes rip2 { 0%, 37% { opacity: 0; } 38% { opacity: .55; } 43%, 100% { opacity: 0; } }
    .menu { animation: menu 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes menu { 0%, 19% { opacity: 0; transform: translateY(-6px); } 23%, 39% { opacity: 1; transform: translateY(0); } 42%, 100% { opacity: 0; transform: translateY(0); } }
    .hov { animation: hov 8s ease infinite both; }
    @keyframes hov { 0%, 29% { opacity: 0; } 31%, 39% { opacity: 1; } 42%, 100% { opacity: 0; } }
    .edge { animation: edge 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes edge { 0%, 41% { opacity: 0; } 45%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .tag { animation: tag 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes tag { 0%, 43% { opacity: 0; transform: translateY(4px); } 48%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .card { animation: card 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes card { 0%, 50% { opacity: 0; transform: translateY(10px); } 55%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .r1 { animation: r1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes r1 { 0%, 55% { opacity: 0; transform: translateY(4px); } 60%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .r2 { animation: r2 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes r2 { 0%, 59% { opacity: 0; transform: translateY(4px); } 64%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .r3 { animation: r3 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes r3 { 0%, 63% { opacity: 0; transform: translateY(4px); } 68%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .r4 { animation: r4 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes r4 { 0%, 68% { opacity: 0; transform: translateY(4px); } 73%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <g class="show">
    <rect x="24" y="24" width="320" height="206" rx="16" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="44" y="50" font-size="12.5" font-weight="600" fill="#0F172A">Gable</text>
    <text x="88" y="50" font-size="11.5" font-weight="500" fill="#64748B">Left end · 720 × 560</text>
    <rect x="84" y="78" width="200" height="124" rx="2" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="184" y="146" text-anchor="middle" font-size="11" font-weight="500" fill="#94A3B8">720 × 560</text>
    <path d="M77 136 L91 150 M91 136 L77 150" stroke="#E11D48" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g class="edge">
    <line x1="84" y1="78" x2="284" y2="78" stroke="#1F2937" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="tag">
    <rect x="148" y="58" width="72" height="16" rx="8" fill="#1F2937"/>
    <text x="184" y="69.5" text-anchor="middle" font-size="9.5" font-weight="600" fill="#FFFFFF">Black</text>
  </g>

  <g class="show">
    <rect x="24" y="250" width="592" height="88" rx="16" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="44" y="276" font-size="12.5" font-weight="600" fill="#0F172A">Your edge tapes</text>
    <text x="150" y="276" font-size="11" font-weight="500" fill="#64748B">most picked first</text>
    <rect x="44" y="292" width="122" height="28" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><circle cx="60" cy="306" r="7" fill="#1F2937"/><text x="73" y="310" font-size="11" font-weight="600" fill="#0F172A">Black 1 × 22</text>
    <rect x="176" y="292" width="112" height="28" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><circle cx="192" cy="306" r="7" fill="#C8A26B"/><text x="205" y="310" font-size="11" font-weight="600" fill="#0F172A">Oak 1 × 22</text>
    <rect x="298" y="292" width="130" height="28" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><circle cx="314" cy="306" r="7" fill="#FFFFFF" stroke="#94A3B8"/><text x="327" y="310" font-size="11" font-weight="600" fill="#0F172A">White 0.8 × 22</text>
    <rect x="438" y="292" width="126" height="28" rx="14" fill="#F1F5F9" stroke="#CBD5E1"/><circle cx="454" cy="306" r="7" fill="#6B4F3A"/><text x="467" y="310" font-size="11" font-weight="600" fill="#0F172A">Walnut 1 × 29</text>
    <circle cx="588" cy="306" r="14" fill="none" stroke="#94A3B8" stroke-dasharray="3 3"/><path d="M582 306 H594 M588 300 V312" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <g class="card">
    <rect x="364" y="24" width="252" height="206" rx="16" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="384" y="50" font-size="12.5" font-weight="600" fill="#0F172A">Edge tape</text>
    <text x="596" y="50" text-anchor="end" font-size="10.5" font-weight="600" fill="#64748B">to order</text>
    <line x1="384" y1="62" x2="596" y2="62" stroke="#E2E8F0"/>
  </g>
  <g class="r1"><circle cx="392" cy="84" r="6" fill="#1F2937"/><text x="404" y="88" font-size="11.5" font-weight="600" fill="#0F172A">Black</text><text x="442" y="88" font-size="11" font-weight="500" fill="#64748B">1 × 22mm</text><text x="596" y="88" text-anchor="end" font-size="11.5" font-weight="600" fill="#0F172A">14.2 m</text></g>
  <g class="r2"><circle cx="392" cy="114" r="6" fill="#C8A26B"/><text x="404" y="118" font-size="11.5" font-weight="600" fill="#0F172A">Oak</text><text x="432" y="118" font-size="11" font-weight="500" fill="#64748B">1 × 22mm</text><text x="596" y="118" text-anchor="end" font-size="11.5" font-weight="600" fill="#0F172A">6.8 m</text></g>
  <g class="r3"><circle cx="392" cy="144" r="6" fill="#FFFFFF" stroke="#94A3B8"/><text x="404" y="148" font-size="11.5" font-weight="600" fill="#0F172A">White</text><text x="443" y="148" font-size="11" font-weight="500" fill="#64748B">0.8 × 22mm</text><text x="596" y="148" text-anchor="end" font-size="11.5" font-weight="600" fill="#0F172A">21.5 m</text></g>
  <g class="r4"><line x1="384" y1="166" x2="596" y2="166" stroke="#E2E8F0"/><text x="384" y="190" font-size="11.5" font-weight="600" fill="#334155">Total incl. excess</text><rect x="532" y="176" width="66" height="22" rx="11" fill="#EFF6FF"/><text x="565" y="191" text-anchor="middle" font-size="11.5" font-weight="700" fill="#2563EB">47.1 m</text></g>

  <g class="menu">
    <rect x="180" y="88" width="178" height="132" rx="10" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <rect x="188" y="96" width="162" height="22" rx="6" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="199" cy="107" r="3.6" fill="none" stroke="#94A3B8" stroke-width="1.4"/><path d="M201.6 109.6 L204.5 112.5" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round"/>
    <text x="210" y="111" font-size="10.5" font-weight="500" fill="#94A3B8">Search colours...</text>
    <text x="196" y="138" font-size="11" font-weight="600" fill="#334155">Matching</text>
  </g>
  <g class="hov"><rect x="186" y="146" width="166" height="22" rx="6" fill="#EFF6FF"/></g>
  <g class="menu">
    <circle cx="202" cy="157" r="5" fill="#1F2937"/><text x="212" y="161" font-size="11" font-weight="600" fill="#0F172A">Black (1 × 22mm)</text>
    <circle cx="202" cy="181" r="5" fill="#C8A26B"/><text x="212" y="185" font-size="11" font-weight="600" fill="#0F172A">Oak (1 × 22mm)</text>
    <circle cx="202" cy="205" r="5" fill="#FFFFFF" stroke="#94A3B8"/><text x="212" y="209" font-size="11" font-weight="600" fill="#0F172A">White (0.8 × 22mm)</text>
  </g>

  <g class="rip1"><circle cx="186" cy="78" r="12" fill="none" stroke="#2563EB" stroke-width="2"/></g>
  <g class="rip2"><circle cx="236" cy="153" r="12" fill="none" stroke="#2563EB" stroke-width="2"/></g>
  <g class="cur"><path d="M0 0 L0 17 L4.6 12.6 L7.6 19.4 L10.4 18.2 L7.4 11.6 L13.4 11.6 Z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/></g>
</svg>
