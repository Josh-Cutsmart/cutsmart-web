<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The Production Cutlist workbook from Downloads being imported into a project: each part listed with a switch, then Add</title>
  <style>
    .flow { animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .file { animation: file 6.5s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes file { 0%, 4% { opacity: 0; transform: translateY(10px); } 10%, 100% { opacity: 1; transform: translateY(0); } }
    .r1 { animation: r1 6.5s ease-out infinite both; }
    .r2 { animation: r2 6.5s ease-out infinite both; }
    .r3 { animation: r3 6.5s ease-out infinite both; }
    .r4 { animation: r4 6.5s ease-out infinite both; }
    .r5 { animation: r5 6.5s ease-out infinite both; }
    @keyframes r1 { 0%, 14% { opacity: 0; } 18%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes r2 { 0%, 19% { opacity: 0; } 23%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes r3 { 0%, 24% { opacity: 0; } 28%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes r4 { 0%, 29% { opacity: 0; } 33%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes r5 { 0%, 34% { opacity: 0; } 38%, 94% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .press { transform-box: fill-box; transform-origin: center; animation: press 6.5s ease-in-out infinite both; }
    @keyframes press { 0%, 56% { transform: scale(1); } 59% { transform: scale(.92); } 62%, 100% { transform: scale(1); } }
    .toast { animation: toast 6.5s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes toast { 0%, 61% { opacity: 0; transform: translateY(12px); } 66%, 90% { opacity: 1; transform: translateY(0); } 95%, 100% { opacity: 0; transform: translateY(0); } }
    .cursor { animation: cursor 6.5s ease-in-out infinite both; }
    @keyframes cursor {
      0%, 38% { transform: translate(600px, 340px); opacity: 0; }
      42% { opacity: 1; }
      54%, 62% { transform: translate(492px, 292px); opacity: 1; }
      74%, 100% { transform: translate(600px, 340px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the workbook -->
  <g class="file">
    <rect x="44" y="104" width="190" height="152" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <rect x="64" y="124" width="40" height="46" rx="8" fill="#16A34A"/>
    <path d="M75 136 l18 22 m0 -22 l-18 22" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round"/>
    <text x="116" y="142" font-size="12" font-weight="700" fill="#0F172A">Production</text>
    <text x="116" y="160" font-size="11" font-weight="500" fill="#334155">Cutlist · .xlsx</text>
    <path d="M64 188 H214" stroke="#E2E8F0"/>
    <rect x="64" y="200" width="54" height="18" rx="5" fill="#DCFCE7"/>
    <text x="91" y="213" text-anchor="middle" font-size="9.5" font-weight="600" fill="#15803D">Dashboard</text>
    <rect x="124" y="200" width="44" height="18" rx="5" fill="#F1F5F9"/>
    <text x="146" y="213" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">Room 1</text>
    <rect x="174" y="200" width="40" height="18" rx="5" fill="#F1F5F9"/>
    <text x="194" y="213" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">Notes</text>
    <text x="64" y="240" font-size="10" font-weight="500" fill="#334155">From Downloads, filled in offline</text>
  </g>

  <path class="flow" d="M244 180 H286" stroke="#2563EB" stroke-width="2.4" stroke-dasharray="8 8" stroke-linecap="round"/>
  <path d="M282 173 l8 7 l-8 7" fill="none" stroke="#2563EB" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Import -->
  <rect x="304" y="36" width="300" height="288" rx="22" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <path d="M304 58 a22 22 0 0 1 22 -22 h256 a22 22 0 0 1 22 22 v22 h-300 z" fill="#F8FAFC"/>
  <path d="M304 80 H604" stroke="#E2E8F0"/>
  <text x="326" y="64" font-size="14" font-weight="700" fill="#0F172A">Import</text>
  <text x="582" y="64" text-anchor="end" font-size="10.5" font-weight="500" fill="#334155">Patel Kitchen</text>

  <g class="r1">
    <text x="326" y="110" font-size="11.5" font-weight="600" fill="#0F172A">Job Selections</text>
    <rect x="550" y="99" width="30" height="16" rx="8" fill="#2563EB"/><circle cx="572" cy="107" r="6" fill="#FFFFFF"/>
  </g>
  <g class="r2">
    <text x="326" y="146" font-size="11.5" font-weight="600" fill="#0F172A">Boards</text>
    <text x="374" y="146" font-size="10.5" font-weight="500" fill="#334155">· 2 new</text>
    <rect x="550" y="135" width="30" height="16" rx="8" fill="#2563EB"/><circle cx="572" cy="143" r="6" fill="#FFFFFF"/>
  </g>
  <g class="r3">
    <text x="326" y="182" font-size="11.5" font-weight="600" fill="#0F172A">Cutlist</text>
    <text x="370" y="182" font-size="10.5" font-weight="500" fill="#334155">· Kitchen, Scullery · 48 parts</text>
    <rect x="550" y="171" width="30" height="16" rx="8" fill="#2563EB"/><circle cx="572" cy="179" r="6" fill="#FFFFFF"/>
  </g>
  <g class="r4">
    <text x="326" y="218" font-size="11.5" font-weight="600" fill="#0F172A">Order</text>
    <text x="362" y="218" font-size="10.5" font-weight="500" fill="#334155">· hinges, other, misc</text>
    <rect x="550" y="207" width="30" height="16" rx="8" fill="#2563EB"/><circle cx="572" cy="215" r="6" fill="#FFFFFF"/>
  </g>
  <g class="r5">
    <text x="326" y="254" font-size="11.5" font-weight="600" fill="#0F172A">Notes</text>
    <rect x="550" y="243" width="30" height="16" rx="8" fill="#CBD5E1"/><circle cx="558" cy="251" r="6" fill="#FFFFFF"/>
  </g>

  <rect x="388" y="278" width="96" height="30" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="436" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#0F172A">Replace All</text>
  <g class="press">
    <rect x="492" y="278" width="92" height="30" rx="10" fill="#2563EB"/>
    <text x="538" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Add</text>
  </g>

  <g class="toast">
    <rect x="44" y="282" width="210" height="34" rx="17" fill="#0F172A"/>
    <circle cx="66" cy="299" r="8" fill="#16A34A"/>
    <path d="M62 299 l3 3 l5 -6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="82" y="303" font-size="11" font-weight="600" fill="#FFFFFF">Imported into Patel Kitchen</text>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
