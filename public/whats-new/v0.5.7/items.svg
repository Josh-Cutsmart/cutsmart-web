<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The item library grouped under coloured sub-category bars; an item dragged into the Kitchen column lands under its own coloured bar</title>
  <style>
    .ghost { animation: ghost 6.5s cubic-bezier(.4, 0, .2, 1) infinite both; }
    @keyframes ghost {
      0%, 17% { opacity: 0; transform: translate(0, 0); }
      20% { opacity: 1; transform: translate(0, 0); }
      44% { opacity: 1; transform: translate(214px, 30px); }
      47%, 100% { opacity: 0; transform: translate(214px, 30px); }
    }
    .newRows { animation: newRows 6.5s ease-out infinite both; }
    @keyframes newRows { 0%, 46% { opacity: 0; } 51%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .countOld { animation: countOld 6.5s linear infinite both; }
    @keyframes countOld { 0%, 47% { opacity: 1; } 48%, 94% { opacity: 0; } 96%, 100% { opacity: 1; } }
    .countNew { animation: countNew 6.5s linear infinite both; }
    @keyframes countNew { 0%, 47% { opacity: 0; } 48%, 94% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .added { transform-box: fill-box; transform-origin: center; animation: added 6.5s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes added { 0%, 47% { opacity: 0; transform: scale(.6); } 52%, 80% { opacity: 1; transform: scale(1); } 85%, 100% { opacity: 0; transform: scale(.6); } }
    .cursor { animation: cursor 6.5s cubic-bezier(.4, 0, .2, 1) infinite both; }
    @keyframes cursor {
      0%, 3% { transform: translate(600px, 340px); opacity: 0; }
      7% { opacity: 1; }
      15%, 20% { transform: translate(120px, 200px); opacity: 1; }
      44%, 50% { transform: translate(334px, 230px); opacity: 1; }
      62%, 100% { transform: translate(600px, 340px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
    <clipPath id="lib"><rect x="28" y="36" width="196" height="288" rx="18"/></clipPath>
    <clipPath id="kit"><rect x="246" y="36" width="176" height="288" rx="18"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the item library -->
  <rect x="28" y="36" width="196" height="288" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <g clip-path="url(#lib)">
    <text x="44" y="64" font-size="14" font-weight="700" fill="#0F172A">Hardware</text>
    <path d="M206 58 l-4 4 l-4 -4" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="80" width="196" height="26" fill="#F97316"/>
    <text x="44" y="97" font-size="12" font-weight="500" fill="#FFFFFF">Blum</text>
    <rect x="28" y="106" width="6" height="66" fill="#F97316"/>
    <text x="46" y="125" font-size="11" font-weight="600" fill="#0F172A">110° Soft Close Hinge</text>
    <path d="M34 138 H224" stroke="#E2E8F0"/>
    <text x="46" y="158" font-size="11" font-weight="600" fill="#0F172A">Tip-On Push Latch</text>
    <rect x="28" y="172" width="196" height="26" fill="#2563EB"/>
    <text x="44" y="189" font-size="12" font-weight="500" fill="#FFFFFF">Drawers</text>
    <rect x="28" y="198" width="6" height="66" fill="#2563EB"/>
    <text x="46" y="217" font-size="11" font-weight="600" fill="#0F172A">Legrabox Drawer</text>
    <path d="M34 230 H224" stroke="#E2E8F0"/>
    <text x="46" y="250" font-size="11" font-weight="600" fill="#0F172A">Inner Pot Drawer</text>
    <rect x="28" y="264" width="196" height="60" fill="#F8FAFC"/>
    <text x="44" y="292" font-size="14" font-weight="700" fill="#0F172A">Benchtops</text>
    <path d="M206 286 l-4 -4 l-4 4" fill="none" stroke="#0F172A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g class="added">
    <rect x="96" y="203" width="62" height="20" rx="10" fill="#16A34A"/>
    <path d="M105 213 l3.5 3.5 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="119" y="217" font-size="10.5" font-weight="700" fill="#FFFFFF">Added</text>
  </g>

  <!-- Kitchen -->
  <rect x="246" y="36" width="176" height="288" rx="18" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" filter="url(#pop)"/>
  <g clip-path="url(#kit)">
    <rect x="246" y="36" width="176" height="36" fill="#EFF6FF"/>
    <text x="260" y="59" font-size="13" font-weight="600" fill="#1D4ED8">Kitchen</text>
    <rect x="364" y="45" width="22" height="18" rx="9" fill="#F1F5F9"/>
    <text class="countOld" x="375" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">4</text>
    <text class="countNew" x="375" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">5</text>
    <circle cx="403" cy="54" r="9" fill="#F1F5F9"/>
    <circle cx="399" cy="54" r="1.4" fill="#334155"/><circle cx="403" cy="54" r="1.4" fill="#334155"/><circle cx="407" cy="54" r="1.4" fill="#334155"/>
    <rect x="256" y="80" width="156" height="28" rx="8" fill="#16A34A"/>
    <text x="334" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">+  Add Item</text>
    <rect x="246" y="118" width="176" height="22" fill="#F97316"/>
    <text x="258" y="133" font-size="11" font-weight="500" fill="#FFFFFF">Blum</text>
    <rect x="246" y="140" width="176" height="48" fill="#FEEBDD"/>
    <text x="258" y="158" font-size="10.5" font-weight="600" fill="#0F172A">110° Soft Close Hinge</text>
    <text x="406" y="158" text-anchor="end" font-size="10.5" font-weight="700" fill="#0F172A">2</text>
    <path d="M246 164 H422" stroke="#F6D2B8"/>
    <text x="258" y="181" font-size="10.5" font-weight="600" fill="#0F172A">Tip-On Push Latch</text>
    <text x="406" y="181" text-anchor="end" font-size="10.5" font-weight="700" fill="#0F172A">2</text>
    <g class="newRows">
      <rect x="246" y="194" width="176" height="22" fill="#2563EB"/>
      <text x="258" y="209" font-size="11" font-weight="500" fill="#FFFFFF">Drawers</text>
      <rect x="246" y="216" width="176" height="26" fill="#DCE7FD"/>
      <text x="258" y="233" font-size="10.5" font-weight="600" fill="#0F172A">Legrabox Drawer</text>
      <text x="406" y="233" text-anchor="end" font-size="10.5" font-weight="700" fill="#0F172A">1</text>
    </g>
  </g>

  <!-- Scullery -->
  <rect x="436" y="36" width="176" height="288" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <text x="450" y="59" font-size="13" font-weight="600" fill="#0F172A">Scullery</text>
  <rect x="554" y="45" width="22" height="18" rx="9" fill="#F1F5F9"/>
  <text x="565" y="58" text-anchor="middle" font-size="10" font-weight="700" fill="#0F172A">2</text>
  <circle cx="593" cy="54" r="9" fill="#F1F5F9"/>
  <circle cx="589" cy="54" r="1.4" fill="#334155"/><circle cx="593" cy="54" r="1.4" fill="#334155"/><circle cx="597" cy="54" r="1.4" fill="#334155"/>
  <path d="M436 72 H612" stroke="#E2E8F0"/>
  <rect x="446" y="80" width="156" height="28" rx="8" fill="#16A34A"/>
  <text x="524" y="98" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">+  Add Item</text>
  <rect x="436" y="118" width="176" height="22" fill="#8B5CF6"/>
  <text x="448" y="133" font-size="11" font-weight="500" fill="#FFFFFF">Benchtops</text>
  <rect x="436" y="140" width="176" height="26" fill="#EEE7FE"/>
  <text x="448" y="157" font-size="10.5" font-weight="600" fill="#0F172A">Laminate Benchtop</text>
  <text x="596" y="157" text-anchor="end" font-size="10.5" font-weight="700" fill="#0F172A">2</text>

  <!-- the item on its way -->
  <g class="ghost">
    <rect x="64" y="190" width="132" height="28" rx="14" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#pop)"/>
    <circle cx="80" cy="204" r="5" fill="#2563EB"/>
    <text x="92" y="208" font-size="11" font-weight="600" fill="#0F172A">Legrabox Drawer</text>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
