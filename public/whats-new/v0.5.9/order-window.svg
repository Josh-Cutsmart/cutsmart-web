<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The redesigned Order: the order at a glance up top, Drawers, Hinges and Other side by side in the hardware's colour, and a hinge dragged in from the Hardware Library</title>
  <style>
    .drag { animation: drag 8s cubic-bezier(.45, 0, .2, 1) infinite both; }
    @keyframes drag {
      0%, 14% { opacity: 0; transform: translate(0, 0); }
      18% { opacity: 1; transform: translate(0, 0); }
      24% { opacity: 1; transform: translate(0, -2px); }
      44% { opacity: 1; transform: translate(274px, 6px); }
      48%, 100% { opacity: 0; transform: translate(274px, 6px); }
    }
    .lit { animation: lit 8s ease-in-out infinite both; }
    @keyframes lit { 0%, 22% { opacity: 0; } 28%, 44% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .line { animation: line 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes line { 0%, 45% { opacity: 0; transform: translateY(-6px); } 51%, 93% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    .c1 { animation: c1 8s step-end infinite both; } .c2 { animation: c2 8s step-end infinite both; }
    @keyframes c1 { 0% { opacity: 1; } 47% { opacity: 0; } 98% { opacity: 1; } }
    @keyframes c2 { 0% { opacity: 0; } 47% { opacity: 1; } 98% { opacity: 0; } }
    .bub { transform-box: fill-box; transform-origin: center; animation: bub 8s ease-in-out infinite both; }
    @keyframes bub { 0%, 46% { transform: scale(1); } 49% { transform: scale(1.18); } 53%, 100% { transform: scale(1); } }
    .lib { animation: lib 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes lib { 0%, 2% { opacity: 0; transform: translateX(-20px); } 8%, 93% { opacity: 1; transform: translateX(0); } 98%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <linearGradient id="hw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EE"/>
      <stop offset="1" stop-color="#FDEBD3"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the top bar -->
  <rect x="0" y="0" width="640" height="40" fill="#FFFFFF" fill-opacity=".8"/>
  <text x="20" y="25" font-size="11.5" font-weight="700" letter-spacing="1" fill="#0F172A">ORDER</text>
  <text x="72" y="25" font-size="11.5" font-weight="500" fill="#64748B">| Patel Kitchen &amp; Scullery</text>

  <!-- the order at a glance -->
  <g font-size="10.5" font-weight="600">
    <rect x="168" y="52" width="88" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="183" cy="65" r="4.5" fill="#EA8A1A"/>
    <text x="193" y="69" fill="#0F172A">Drawers</text>
    <text x="244" y="69" text-anchor="end" fill="#0F172A">12</text>
    <g class="bub">
      <rect x="264" y="52" width="82" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
      <circle cx="279" cy="65" r="4.5" fill="#EA8A1A"/>
      <text x="289" y="69" fill="#0F172A">Hinges</text>
      <text class="c1" x="334" y="69" text-anchor="end" fill="#0F172A">0</text>
      <text class="c2" x="334" y="69" text-anchor="end" fill="#0F172A">8</text>
    </g>
    <rect x="354" y="52" width="78" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="369" cy="65" r="4.5" fill="#EA8A1A"/>
    <text x="379" y="69" fill="#0F172A">Other</text>
    <text x="420" y="69" text-anchor="end" fill="#0F172A">4</text>
    <rect x="440" y="52" width="82" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="455" cy="65" r="4.5" fill="#2563EB"/>
    <text x="465" y="69" fill="#0F172A">Boards</text>
    <text x="510" y="69" text-anchor="end" fill="#0F172A">3</text>
    <rect x="530" y="52" width="72" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="545" cy="65" r="4.5" fill="#16A34A"/>
    <text x="555" y="69" fill="#0F172A">Misc</text>
    <text x="590" y="69" text-anchor="end" fill="#0F172A">2</text>
  </g>

  <!-- the hardware: its three parts side by side -->
  <rect x="168" y="92" width="452" height="150" rx="20" fill="url(#hw)" stroke="#F5D2A3" filter="url(#pop)"/>
  <circle cx="190" cy="114" r="5" fill="#EA8A1A"/>
  <text x="202" y="119" font-size="13" font-weight="600" fill="#0F172A">Hardware</text>
  <text x="270" y="119" font-size="11" font-weight="500" fill="#64748B">Blum</text>
  <g font-size="9.5" font-weight="600" letter-spacing=".7" fill="#0F172A">
    <text x="184" y="146">DRAWERS</text>
    <text x="336" y="146">HINGES</text>
    <text x="484" y="146">OTHER</text>
  </g>
  <path d="M326 134 V232 M474 134 V232" stroke="#F1D2A8"/>
  <!-- drawers -->
  <g font-size="10.5" font-weight="500" fill="#0F172A">
    <text x="184" y="170">450 · Back 116</text><text x="310" y="170" text-anchor="end" font-weight="700">6</text>
    <path d="M184 180 H314" stroke="#F1D2A8"/>
    <text x="184" y="198">500 · Back 167</text><text x="310" y="198" text-anchor="end" font-weight="700">6</text>
  </g>
  <!-- hinges: the one dropped in -->
  <rect class="lit" x="330" y="130" width="140" height="106" rx="12" fill="#EA8A1A" fill-opacity=".14" stroke="#EA8A1A" stroke-width="2"/>
  <g class="line">
    <rect x="338" y="158" width="94" height="22" rx="7" fill="#FFFFFF" fill-opacity=".85"/>
    <text x="345" y="173" font-size="10" font-weight="600" fill="#0F172A">110° Soft Close</text>
    <rect x="436" y="158" width="28" height="22" rx="7" fill="#FFFFFF" fill-opacity=".85"/>
    <text x="450" y="173" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">8</text>
    <text x="338" y="196" font-size="9" font-weight="500" fill="#64748B">71B3550 ⧉</text>
  </g>
  <!-- other -->
  <g font-size="10.5" font-weight="500" fill="#0F172A">
    <text x="484" y="170">Shelf supports</text><text x="606" y="170" text-anchor="end" font-weight="700">4</text>
  </g>

  <!-- boards and misc -->
  <rect x="168" y="254" width="262" height="86" rx="18" fill="#EFF6FF" stroke="#BFDBFE" filter="url(#pop)"/>
  <circle cx="188" cy="274" r="5" fill="#2563EB"/>
  <text x="200" y="279" font-size="12.5" font-weight="600" fill="#0F172A">Boards</text>
  <g font-size="10" font-weight="500" fill="#0F172A">
    <text x="186" y="302">Natural Oak 18mm</text><text x="414" y="302" text-anchor="end" font-weight="700">6 sheets</text>
    <text x="186" y="322">Chalk White 18mm</text><text x="414" y="322" text-anchor="end" font-weight="700">4 sheets</text>
  </g>
  <rect x="442" y="254" width="178" height="86" rx="18" fill="#F0FDF4" stroke="#BBF7D0" filter="url(#pop)"/>
  <circle cx="462" cy="274" r="5" fill="#16A34A"/>
  <text x="474" y="279" font-size="12.5" font-weight="600" fill="#0F172A">Misc</text>
  <g font-size="10" font-weight="500" fill="#0F172A">
    <text x="460" y="302">Kick clips</text><text x="604" y="302" text-anchor="end" font-weight="700">20</text>
    <text x="460" y="322">Edge tape</text><text x="604" y="322" text-anchor="end" font-weight="700">2</text>
  </g>

  <!-- the Hardware Library, down the left -->
  <g class="lib">
    <rect x="16" y="52" width="140" height="288" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="30" y="76" font-size="10" font-weight="700" letter-spacing=".7" fill="#0F172A">HARDWARE LIBRARY</text>
    <rect x="28" y="86" width="116" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="40" y="102" font-size="9.5" font-weight="500" fill="#94A3B8">Search…</text>
    <text x="30" y="132" font-size="9.5" font-weight="700" fill="#64748B">Hinges</text>
    <rect x="28" y="140" width="116" height="24" rx="12" fill="#FFF4E5" stroke="#F5D2A3"/>
    <text x="40" y="156" font-size="9.5" font-weight="600" fill="#0F172A">110° Soft Close</text>
    <rect x="28" y="170" width="116" height="24" rx="12" fill="#FFF4E5" stroke="#F5D2A3"/>
    <text x="40" y="186" font-size="9.5" font-weight="600" fill="#0F172A">155° Wide Angle</text>
    <rect x="28" y="200" width="116" height="24" rx="12" fill="#FFF4E5" stroke="#F5D2A3"/>
    <text x="40" y="216" font-size="9.5" font-weight="600" fill="#0F172A">Blind Corner</text>
    <text x="30" y="246" font-size="9.5" font-weight="700" fill="#64748B">Other</text>
    <rect x="28" y="254" width="116" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="40" y="270" font-size="9.5" font-weight="600" fill="#0F172A">Shelf supports</text>
    <rect x="28" y="284" width="116" height="24" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text x="40" y="300" font-size="9.5" font-weight="600" fill="#0F172A">Bin pull-out</text>
  </g>

  <!-- dragged across -->
  <g class="drag">
    <rect x="62" y="152" width="116" height="24" rx="12" fill="#FFF4E5" stroke="#EA8A1A" stroke-width="1.5" filter="url(#pop)" transform="rotate(-3 120 164)"/>
    <text x="74" y="168" font-size="9.5" font-weight="600" fill="#0F172A" transform="rotate(-3 120 164)">110° Soft Close</text>
    <path d="M150 166 l0 18 l4.5 -4.5 l3.6 8 l3 -1.4 l-3.6 -8 l6.3 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.3" stroke-linejoin="round"/>
  </g>
</svg>
