<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Create Project on a lead fills in the New Project pop-up from it — the client's name, phone, email, address, notes and photos — and the lead is archived as converted</title>
  <style>
    .press { transform-box: fill-box; transform-origin: center; animation: press 8s ease-in-out infinite both; }
    @keyframes press { 0%, 16% { transform: scale(1); } 18% { transform: scale(.93); } 21%, 100% { transform: scale(1); } }
    .form { animation: form 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes form { 0%, 20% { opacity: 0; transform: translateX(-24px) scale(.96); } 27%, 93% { opacity: 1; transform: translateX(0) scale(1); } 98%, 100% { opacity: 0; } }
    .f1 { animation: f1 8s ease-out infinite both; } .f2 { animation: f2 8s ease-out infinite both; }
    .f3 { animation: f3 8s ease-out infinite both; } .f4 { animation: f4 8s ease-out infinite both; }
    .f5 { animation: f5 8s ease-out infinite both; } .f6 { animation: f6 8s ease-out infinite both; }
    @keyframes f1 { 0%, 29% { opacity: 0; } 32%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes f2 { 0%, 33% { opacity: 0; } 36%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes f3 { 0%, 37% { opacity: 0; } 40%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes f4 { 0%, 41% { opacity: 0; } 44%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes f5 { 0%, 45% { opacity: 0; } 48%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes f6 { 0%, 49% { opacity: 0; } 52%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .flow { animation: flow 8s ease-in-out infinite both; }
    @keyframes flow { 0%, 20% { opacity: 0; transform: translateX(-8px); } 25%, 52% { opacity: 1; transform: translateX(0); } 56%, 100% { opacity: 0; transform: translateX(8px); } }
    .create { transform-box: fill-box; transform-origin: center; animation: create 8s ease-in-out infinite both; }
    @keyframes create { 0%, 58% { transform: scale(1); } 60% { transform: scale(.93); } 63%, 100% { transform: scale(1); } }
    .done { animation: done 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes done { 0%, 63% { opacity: 0; transform: translateY(10px); } 69%, 93% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    .archived { animation: archived 8s ease-out infinite both; }
    @keyframes archived { 0%, 64% { opacity: 0; } 69%, 93% { opacity: 1; } 98%, 100% { opacity: 0; } }
    .lead { animation: lead 8s ease-out infinite both; }
    @keyframes lead { 0%, 64% { opacity: 1; } 69%, 93% { opacity: .55; } 100% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the lead -->
  <g class="lead">
    <rect x="24" y="28" width="250" height="304" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <rect x="24" y="28" width="250" height="60" rx="20" fill="#F3E8FF"/>
    <rect x="24" y="68" width="250" height="20" fill="#F3E8FF"/>
    <text x="42" y="56" font-size="15" font-weight="700" fill="#0F172A">Anil Patel</text>
    <rect x="42" y="64" width="78" height="16" rx="8" fill="#7C3AED"/>
    <text x="81" y="75.5" text-anchor="middle" font-size="9" font-weight="600" fill="#FFFFFF">Quote sent</text>
    <text x="42" y="112" font-size="9.5" font-weight="700" letter-spacing=".6" fill="#64748B">PHONE</text>
    <text x="42" y="127" font-size="11.5" font-weight="500" fill="#0F172A">021 555 0117</text>
    <text x="42" y="150" font-size="9.5" font-weight="700" letter-spacing=".6" fill="#64748B">EMAIL</text>
    <text x="42" y="165" font-size="11.5" font-weight="500" fill="#0F172A">anil.patel@example.com</text>
    <text x="42" y="188" font-size="9.5" font-weight="700" letter-spacing=".6" fill="#64748B">ADDRESS</text>
    <text x="42" y="203" font-size="11.5" font-weight="500" fill="#0F172A">14 Rata Street, Hamilton</text>
    <rect x="42" y="216" width="44" height="34" rx="7" fill="#E2E8F0"/>
    <path d="M47 244 L58 231 L66 239 L72 233 L81 244 Z" fill="#94A3B8"/>
    <rect x="92" y="216" width="44" height="34" rx="7" fill="#E2E8F0"/>
    <path d="M97 244 L108 231 L116 239 L122 233 L131 244 Z" fill="#94A3B8"/>
    <text x="42" y="270" font-size="10" font-weight="500" fill="#334155">• New kitchen and scullery, oak</text>
    <g class="press">
      <rect x="42" y="284" width="214" height="32" rx="16" fill="#16A34A"/>
      <text x="149" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Create Project</text>
    </g>
    <g class="archived">
      <rect x="150" y="38" width="110" height="20" rx="10" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="205" y="52" text-anchor="middle" font-size="9.5" font-weight="600" fill="#334155">Archived · converted</text>
    </g>
  </g>

  <!-- what it fills in -->
  <g class="flow" fill="#7C3AED">
    <circle cx="288" cy="180" r="3"/><circle cx="300" cy="180" r="3"/><circle cx="312" cy="180" r="3"/>
    <path d="M320 172 L330 180 L320 188 Z"/>
  </g>

  <!-- the New Project pop-up, filled in -->
  <g class="form">
    <rect x="344" y="28" width="272" height="304" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="362" y="56" font-size="12" font-weight="700" letter-spacing="1" fill="#0F172A">NEW PROJECT</text>
    <path d="M344 68 H616" stroke="#E2E8F0"/>
    <text x="362" y="88" font-size="9.5" font-weight="700" letter-spacing=".6" fill="#64748B">PROJECT NAME</text>
    <rect x="362" y="94" width="236" height="24" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text class="f1" x="372" y="110" font-size="11" font-weight="500" fill="#0F172A">Patel Kitchen &amp; Scullery</text>
    <text x="362" y="134" font-size="9.5" font-weight="700" letter-spacing=".6" fill="#64748B">CLIENT</text>
    <rect x="362" y="140" width="236" height="24" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text class="f2" x="372" y="156" font-size="11" font-weight="500" fill="#0F172A">Anil Patel · 021 555 0117</text>
    <rect x="362" y="170" width="236" height="24" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text class="f3" x="372" y="186" font-size="11" font-weight="500" fill="#0F172A">anil.patel@example.com</text>
    <rect x="362" y="200" width="236" height="24" rx="8" fill="#F8FAFC" stroke="#CBD5E1"/>
    <text class="f4" x="372" y="216" font-size="11" font-weight="500" fill="#0F172A">14 Rata Street, Hamilton</text>
    <g class="f5">
      <rect x="362" y="232" width="32" height="24" rx="6" fill="#E2E8F0"/>
      <rect x="398" y="232" width="32" height="24" rx="6" fill="#E2E8F0"/>
      <text x="438" y="248" font-size="10" font-weight="500" fill="#334155">2 photos from the lead</text>
    </g>
    <text class="f6" x="362" y="274" font-size="10" font-weight="500" fill="#334155">• New kitchen and scullery, oak</text>
    <g class="create">
      <rect x="476" y="288" width="122" height="30" rx="15" fill="#2563EB"/>
      <text x="537" y="307" text-anchor="middle" font-size="11.5" font-weight="600" fill="#FFFFFF">Create Project</text>
    </g>
  </g>

  <!-- made -->
  <g class="done">
    <rect x="360" y="244" width="240" height="56" rx="16" fill="#FFFFFF" stroke="#BBF7D0" filter="url(#pop)"/>
    <circle cx="384" cy="272" r="12" fill="#DCFCE7"/>
    <path d="M378 272 L382.5 276.5 L390 268" fill="none" stroke="#16A34A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="404" y="268" font-size="11.5" font-weight="700" fill="#0F172A">Patel Kitchen &amp; Scullery</text>
    <text x="404" y="284" font-size="10" font-weight="500" fill="#64748B">Made from the lead — its Lead tab opens it</text>
  </g>
</svg>
