<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Clicking a Notes card to type straight into it, then clicking away to save</title>
  <style>
    .toolbar { animation: toolbar 6s ease-in-out infinite both; }
    @keyframes toolbar { 0%, 15% { opacity: 0; } 19%, 64% { opacity: 1; } 68%, 100% { opacity: 0; } }
    .editing { animation: editing 6s ease-in-out infinite both; }
    @keyframes editing { 0%, 15% { stroke: #E2E8F0; } 19%, 64% { stroke: #93C5FD; } 68%, 100% { stroke: #E2E8F0; } }
    .typed { animation: typed 6s ease-in-out infinite both; }
    @keyframes typed { 0%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .caret { animation: caret 6s linear infinite both; }
    @keyframes caret {
      0%, 17% { opacity: 0; transform: translateX(0); }
      18%, 22% { opacity: 1; transform: translateX(0); }
      52%, 64% { opacity: 1; transform: translateX(204px); }
      65%, 100% { opacity: 0; transform: translateX(204px); }
    }
    .saved { animation: saved 6s ease-in-out infinite both; }
    @keyframes saved { 0%, 66% { opacity: 0; } 70%, 88% { opacity: 1; } 93%, 100% { opacity: 0; } }
    .cursor { animation: cursor 6s ease-in-out infinite both; }
    @keyframes cursor {
      0%, 3% { transform: translate(560px, 330px); opacity: 0; }
      7% { opacity: 1; }
      14%, 18% { transform: translate(300px, 160px); opacity: 1; }
      24%, 48% { transform: translate(330px, 200px); opacity: 1; }
      58%, 66% { transform: translate(580px, 320px); opacity: 1; }
      74%, 100% { transform: translate(600px, 340px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
    <clipPath id="typing">
      <rect x="132" y="168" height="24" width="0">
        <animate attributeName="width" dur="6s" repeatCount="indefinite" values="0;0;206;206" keyTimes="0;0.22;0.52;1"/>
      </rect>
    </clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <rect class="editing" x="104" y="52" width="432" height="252" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" filter="url(#pop)"/>
  <path d="M104 74 a22 22 0 0 1 22 -22 h388 a22 22 0 0 1 22 22 v28 h-432 z" fill="#F8FAFC"/>
  <path d="M104 102 H536" stroke="#E2E8F0"/>
  <rect x="128" y="70" width="11" height="14" rx="2" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <path d="M131 75 h5 M131 79 h5" stroke="#64748B" stroke-width="1.2" stroke-linecap="round"/>
  <text x="148" y="82" font-size="13" font-weight="500" letter-spacing="1" fill="#0F172A">NOTES</text>

  <!-- formatting, while typing -->
  <g class="toolbar">
    <rect x="388" y="64" width="128" height="26" rx="13" fill="#FFFFFF" stroke="#E2E8F0"/>
    <text x="404" y="82" font-size="12" font-weight="800" fill="#334155">B</text>
    <text x="428" y="82" font-size="12" font-style="italic" font-weight="600" fill="#334155">I</text>
    <text x="448" y="82" font-size="12" font-weight="600" text-decoration="underline" fill="#334155">U</text>
    <path d="M472 72 h2 m4 0 h18 M472 77 h2 m4 0 h18 M472 82 h2 m4 0 h18" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <text x="132" y="150" font-size="13" fill="#0F172A">Oak unit with open shelves either side of the TV.</text>
  <g class="typed" clip-path="url(#typing)">
    <text x="132" y="184" font-size="13" fill="#0F172A">Walnut trim on the shelf edges.</text>
  </g>
  <rect class="caret" x="133" y="170" width="1.6" height="18" fill="#2563EB"/>

  <g class="saved">
    <circle cx="140" cy="276" r="8" fill="#DCFCE7"/>
    <path d="M136.5 276 l2.5 2.5 l4.5 -5" fill="none" stroke="#16A34A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="154" y="280" font-size="11" font-weight="600" fill="#16A34A">Saved</text>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
