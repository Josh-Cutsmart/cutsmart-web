<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A calendar category's reminders: rows of "how long before, at what time", and a new one being added</title>
  <style>
    .addBtn { transform-box: fill-box; transform-origin: center; animation: addBtn 6s ease-in-out infinite both; }
    @keyframes addBtn { 0%, 16% { transform: scale(1); } 19% { transform: scale(.92); } 22%, 100% { transform: scale(1); } }
    .newRow { animation: newRow 6s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes newRow { 0%, 21% { opacity: 0; transform: translateY(-10px); } 29%, 90% { opacity: 1; transform: translateY(0); } 97%, 100% { opacity: 0; transform: translateY(0); } }
    .addMove { animation: addMove 6s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes addMove { 0%, 21% { transform: translateY(0); } 29%, 92% { transform: translateY(46px); } 99%, 100% { transform: translateY(0); } }
    .unitDay { animation: unitDay 6s steps(1) infinite both; }
    @keyframes unitDay { 0%, 52% { opacity: 1; } 53%, 100% { opacity: 0; } }
    .unitWeek { animation: unitWeek 6s steps(1) infinite both; }
    @keyframes unitWeek { 0%, 52% { opacity: 0; } 53%, 100% { opacity: 1; } }
    .unitBox { animation: unitBox 6s ease-in-out infinite both; }
    @keyframes unitBox { 0%, 40% { stroke: #D7DEE8; } 44%, 56% { stroke: #2563EB; } 60%, 100% { stroke: #D7DEE8; } }
    .cursor { animation: cursor 6s ease-in-out infinite both; }
    @keyframes cursor {
      0%, 3% { transform: translate(560px, 330px); opacity: 0; }
      7% { opacity: 1; }
      15%, 20% { transform: translate(196px, 262px); opacity: 1; }
      38%, 50% { transform: translate(214px, 254px); opacity: 1; }
      64%, 100% { transform: translate(560px, 330px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <rect x="104" y="24" width="432" height="312" rx="22" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <text x="128" y="56" font-size="11" font-weight="600" fill="#2563EB">‹ Calendar</text>
  <circle cx="134" cy="84" r="6" fill="#8B5CF6"/>
  <text x="148" y="89" font-size="16" font-weight="700" fill="#0F172A">Installs</text>
  <!-- on -->
  <rect x="470" y="73" width="40" height="22" rx="11" fill="#2563EB"/>
  <circle cx="499" cy="84" r="8.5" fill="#FFFFFF"/>
  <text x="128" y="116" font-size="10.5" fill="#64748B">Reminders for events in this category</text>
  <path d="M128 130 H512" stroke="#E2E8F0"/>

  <!-- 1 day before, at 8:00 am -->
  <rect x="128" y="144" width="36" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
  <text x="146" y="164" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">1</text>
  <rect x="172" y="144" width="70" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
  <text x="182" y="164" font-size="11.5" font-weight="500" fill="#0F172A">day</text>
  <path d="M228 157 l4 4 l4 -4" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="250" y="164" font-size="11.5" fill="#334155">before, at</text>
  <rect x="312" y="144" width="62" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
  <text x="322" y="164" font-size="11.5" font-weight="500" fill="#0F172A">8:00</text>
  <path d="M360 157 l4 4 l4 -4" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <rect x="380" y="144" width="52" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
  <text x="390" y="164" font-size="11.5" font-weight="500" fill="#0F172A">am</text>
  <path d="M418 157 l4 4 l4 -4" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M496 152 h12 m-10 0 v14 h8 v-14 m-6 -3 h4" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2 hours before -->
  <rect x="128" y="190" width="36" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
  <text x="146" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">2</text>
  <rect x="172" y="190" width="70" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
  <text x="182" y="210" font-size="11.5" font-weight="500" fill="#0F172A">hours</text>
  <path d="M228 203 l4 4 l4 -4" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <text x="250" y="210" font-size="11.5" fill="#334155">before</text>
  <path d="M496 198 h12 m-10 0 v14 h8 v-14 m-6 -3 h4" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- the new one: 1 day → week before, at 9:00 am -->
  <g class="newRow">
    <rect x="128" y="236" width="36" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
    <text x="146" y="256" text-anchor="middle" font-size="12" font-weight="600" fill="#0F172A">1</text>
    <rect class="unitBox" x="172" y="236" width="70" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
    <text class="unitDay" x="182" y="256" font-size="11.5" font-weight="500" fill="#0F172A">day</text>
    <text class="unitWeek" x="182" y="256" font-size="11.5" font-weight="500" fill="#0F172A">week</text>
    <path d="M228 249 l4 4 l4 -4" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <text x="250" y="256" font-size="11.5" fill="#334155">before, at</text>
    <rect x="312" y="236" width="62" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
    <text x="322" y="256" font-size="11.5" font-weight="500" fill="#0F172A">9:00</text>
    <path d="M360 249 l4 4 l4 -4" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="380" y="236" width="52" height="30" rx="8" fill="#F8FAFC" stroke="#D7DEE8"/>
    <text x="390" y="256" font-size="11.5" font-weight="500" fill="#0F172A">am</text>
    <path d="M418 249 l4 4 l4 -4" fill="none" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M496 244 h12 m-10 0 v14 h8 v-14 m-6 -3 h4" fill="none" stroke="#94A3B8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g class="addMove">
    <g class="addBtn">
      <rect x="128" y="244" width="118" height="28" rx="14" fill="#EFF6FF" stroke="#BFDBFE"/>
      <text x="187" y="262" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2563EB">+ Add reminder</text>
    </g>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
