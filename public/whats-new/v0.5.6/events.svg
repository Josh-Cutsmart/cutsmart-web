<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A calendar event showing who added and changed it; its … menu duplicates it into a new event</title>
  <style>
    .dots { transform-box: fill-box; transform-origin: center; animation: dots 6.5s ease-in-out infinite both; }
    @keyframes dots { 0%, 15% { transform: scale(1); } 18% { transform: scale(.88); } 21%, 100% { transform: scale(1); } }
    .menu { transform-box: fill-box; transform-origin: 100% 0; animation: menu 6.5s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes menu { 0%, 18% { opacity: 0; transform: scale(.9); } 23%, 40% { opacity: 1; transform: scale(1); } 44%, 100% { opacity: 0; transform: scale(.96); } }
    .dupHi { animation: dupHi 6.5s ease-in-out infinite both; }
    @keyframes dupHi { 0%, 31% { opacity: 0; } 34%, 42% { opacity: 1; } 45%, 100% { opacity: 0; } }
    .copy { animation: copy 6.5s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes copy { 0%, 42% { opacity: 0; transform: translate(0, 0); } 52%, 88% { opacity: 1; transform: translate(34px, 26px); } 95%, 100% { opacity: 0; transform: translate(34px, 26px); } }
    .cursor { animation: cursor 6.5s ease-in-out infinite both; }
    @keyframes cursor {
      0%, 3% { transform: translate(560px, 330px); opacity: 0; }
      7% { opacity: 1; }
      15%, 19% { transform: translate(440px, 66px); opacity: 1; }
      32%, 40% { transform: translate(410px, 104px); opacity: 1; }
      54%, 100% { transform: translate(560px, 330px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the event -->
  <rect x="140" y="36" width="340" height="270" rx="22" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <text x="164" y="74" font-size="17" font-weight="700" fill="#0F172A">Benchtop install</text>
  <g class="dots">
    <circle cx="434" cy="66" r="13" fill="#F1F5F9"/>
    <circle cx="428.5" cy="66" r="1.8" fill="#334155"/>
    <circle cx="434" cy="66" r="1.8" fill="#334155"/>
    <circle cx="439.5" cy="66" r="1.8" fill="#334155"/>
  </g>
  <circle cx="462" cy="66" r="13" fill="#F1F5F9"/>
  <path d="M457.5 61.5 l9 9 m0 -9 l-9 9" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>

  <text x="164" y="108" font-size="11.5" fill="#334155">Thu 16 Oct · 9:00 am – 12:00 pm</text>
  <rect x="164" y="120" width="70" height="22" rx="11" fill="#F3E8FF" stroke="#D8B4FE"/>
  <circle cx="177" cy="131" r="4" fill="#8B5CF6"/>
  <text x="186" y="135" font-size="10.5" font-weight="600" fill="#6D28D9">Installs</text>
  <text x="164" y="168" font-size="11.5" fill="#334155">90 Ridgeway Drive, Tauranga</text>
  <text x="164" y="188" font-size="11.5" fill="#334155">Ridgeway Entertainment Unit</text>

  <path d="M164 214 H456" stroke="#E2E8F0"/>
  <circle cx="172" cy="236" r="8" fill="#C2410C"/>
  <text x="172" y="239" text-anchor="middle" font-size="7" font-weight="700" fill="#FFFFFF">MT</text>
  <text x="186" y="240" font-size="10.5" fill="#334155">Added by <tspan font-weight="600" fill="#0F172A">Mere Tawhiri</tspan> · 3 days ago</text>
  <circle cx="172" cy="262" r="8" fill="#2563EB"/>
  <text x="172" y="265" text-anchor="middle" font-size="7" font-weight="700" fill="#FFFFFF">AM</text>
  <text x="186" y="266" font-size="10.5" fill="#334155">Modified by <tspan font-weight="600" fill="#0F172A">Alex Morgan</tspan> · 5 minutes ago</text>

  <!-- … menu -->
  <g class="menu">
    <rect x="336" y="84" width="122" height="72" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#pop)"/>
    <rect class="dupHi" x="342" y="90" width="110" height="28" rx="8" fill="#EEF2FF"/>
    <rect x="352" y="98" width="9" height="11" rx="2" fill="none" stroke="#334155" stroke-width="1.3"/>
    <rect x="355" y="95" width="9" height="11" rx="2" fill="#FFFFFF" stroke="#334155" stroke-width="1.3"/>
    <text x="372" y="108" font-size="10.5" font-weight="500" fill="#0F172A">Duplicate</text>
    <path d="M352 131 h10 m-8.5 0 v10 h7 v-10 m-5 -2.5 h3" fill="none" stroke="#DC2626" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="372" y="140" font-size="10.5" font-weight="500" fill="#DC2626">Delete Event</text>
  </g>

  <!-- the duplicate: a new event with the same details, no category yet -->
  <g class="copy">
    <rect x="140" y="36" width="340" height="270" rx="22" fill="#FFFFFF" stroke="#BFDBFE" filter="url(#pop)"/>
    <text x="164" y="74" font-size="17" font-weight="700" fill="#0F172A">Benchtop install</text>
    <circle cx="462" cy="66" r="13" fill="#F1F5F9"/>
    <path d="M457.5 61.5 l9 9 m0 -9 l-9 9" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
    <text x="164" y="108" font-size="11.5" fill="#334155">Thu 16 Oct · 9:00 am – 12:00 pm</text>
    <rect x="164" y="120" width="112" height="22" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-dasharray="4 3"/>
    <text x="220" y="135" text-anchor="middle" font-size="10.5" font-weight="600" fill="#64748B">Choose category</text>
    <text x="164" y="168" font-size="11.5" fill="#334155">90 Ridgeway Drive, Tauranga</text>
    <text x="164" y="188" font-size="11.5" fill="#334155">Ridgeway Entertainment Unit</text>
    <path d="M164 214 H456" stroke="#E2E8F0"/>
    <rect x="364" y="248" width="92" height="30" rx="15" fill="#2563EB"/>
    <text x="410" y="267" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">Add event</text>
    <text x="164" y="267" font-size="10.5" font-weight="600" fill="#2563EB">New event</text>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
