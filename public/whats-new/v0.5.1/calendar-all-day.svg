<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Day view: tapping + adds an all-day event on the day being looked at</title>
  <style>
    .press { transform-box: fill-box; transform-origin: center; animation: press 5s ease-in-out infinite both; }
    @keyframes press { 0%, 18% { transform: scale(1); } 22% { transform: scale(.84); } 27%, 100% { transform: scale(1); } }
    .ripple { transform-box: fill-box; transform-origin: center; animation: ripple 5s ease-out infinite both; }
    @keyframes ripple { 0%, 20% { opacity: 0; transform: scale(.6); } 23% { opacity: .5; transform: scale(1); } 34%, 100% { opacity: 0; transform: scale(1.7); } }
    .event { transform-box: fill-box; transform-origin: 0% 50%; animation: event 5s cubic-bezier(.22,1,.36,1) infinite both; }
    @keyframes event { 0%, 30% { opacity: 0; transform: scaleX(.6); } 40%, 88% { opacity: 1; transform: scaleX(1); } 96%, 100% { opacity: 0; transform: scaleX(1); } }
    .chip { animation: chip 5s ease-in-out infinite both; }
    @keyframes chip { 0%, 36% { opacity: 0; } 44%, 88% { opacity: 1; } 96%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F172A" flood-opacity=".1"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1D4ED8" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the day -->
  <rect x="70" y="24" width="500" height="316" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#soft)"/>
  <text x="94" y="58" font-size="17" font-weight="600" fill="#0F172A">Friday 9 October</text>
  <g font-size="11" font-weight="600">
    <rect x="404" y="40" width="148" height="26" rx="9" fill="#F1F5F9"/>
    <rect x="407" y="43" width="46" height="20" rx="7" fill="url(#brand)"/>
    <text x="430" y="57" text-anchor="middle" fill="#FFFFFF">Day</text>
    <text x="478" y="57" text-anchor="middle" fill="#64748B">Week</text>
    <text x="526" y="57" text-anchor="middle" fill="#64748B">Month</text>
  </g>

  <!-- the all-day row -->
  <rect x="86" y="80" width="468" height="34" rx="9" fill="#F8FAFC" stroke="#EEF2F7"/>
  <text x="98" y="101" font-size="10" font-weight="600" fill="#94A3B8">ALL DAY</text>
  <g class="event">
    <rect x="160" y="85" width="230" height="24" rx="7" fill="#DCFCE7" stroke="#22C55E"/>
    <text x="172" y="101" font-size="11.5" font-weight="600" fill="#14532D">Site measure · Smith Kitchen</text>
  </g>

  <!-- the hours -->
  <g font-size="10" fill="#94A3B8">
    <text x="98" y="141">9 am</text><line x1="146" y1="137" x2="554" y2="137" stroke="#EEF2F7"/>
    <text x="98" y="181">10 am</text><line x1="146" y1="177" x2="554" y2="177" stroke="#EEF2F7"/>
    <text x="98" y="221">11 am</text><line x1="146" y1="217" x2="554" y2="217" stroke="#EEF2F7"/>
    <text x="98" y="261">12 pm</text><line x1="146" y1="257" x2="554" y2="257" stroke="#EEF2F7"/>
    <text x="98" y="301">1 pm</text><line x1="146" y1="297" x2="554" y2="297" stroke="#EEF2F7"/>
  </g>
  <rect x="160" y="182" width="200" height="34" rx="7" fill="#EDE9FE" stroke="#A78BFA"/>
  <text x="172" y="203" font-size="11" font-weight="600" fill="#4C1D95">Install · Taylor Kitchen</text>

  <!-- the new event pop-up's All day switch -->
  <g class="chip">
    <rect x="388" y="230" width="132" height="34" rx="10" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#soft)"/>
    <text x="400" y="251" font-size="11.5" font-weight="600" fill="#0F172A">All day</text>
    <rect x="476" y="239" width="30" height="16" rx="8" fill="#2563EB"/>
    <circle cx="498" cy="247" r="6" fill="#FFFFFF"/>
  </g>

  <!-- the + button -->
  <circle class="ripple" cx="526" cy="300" r="26" fill="#3B82F6"/>
  <g class="press" filter="url(#lift)">
    <circle cx="526" cy="300" r="24" fill="url(#brand)"/>
    <path d="M526 289 v22 M515 300 h22" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
  </g>
</svg>
