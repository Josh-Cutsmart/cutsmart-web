<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>A column's sort menu choosing A to Z, and its cards moving into order</title>
  <style>
    .menu { animation: menu 6s ease-in-out infinite both; transform-box: fill-box; transform-origin: 0% 0%; }
    @keyframes menu {
      0%, 4% { opacity: 0; transform: scale(.94); }
      10%, 30% { opacity: 1; transform: scale(1); }
      36%, 100% { opacity: 0; transform: scale(.94); }
    }
    .pick { animation: pick 6s ease-in-out infinite both; }
    @keyframes pick { 0%, 14% { transform: translateY(0); } 22%, 100% { transform: translateY(78px); } }
    .press { transform-box: fill-box; transform-origin: center; animation: press 6s ease-in-out infinite both; }
    @keyframes press { 0%, 3% { transform: scale(1); } 5% { transform: scale(.86); } 7%, 100% { transform: scale(1); } }
    .label { animation: label 6s ease-in-out infinite both; }
    @keyframes label { 0%, 30% { opacity: 0; } 36%, 90% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .a { animation: a 6s ease-in-out infinite both; }
    @keyframes a { 0%, 38% { transform: translateY(0); } 50%, 88% { transform: translateY(-116px); } 96%, 100% { transform: translateY(0); } }
    .b { animation: b 6s ease-in-out infinite both; }
    @keyframes b { 0%, 38% { transform: translateY(0); } 50%, 88% { transform: translateY(58px); } 96%, 100% { transform: translateY(0); } }
    .c { animation: c 6s ease-in-out infinite both; }
    @keyframes c { 0%, 38% { transform: translateY(0); } 50%, 88% { transform: translateY(58px); } 96%, 100% { transform: translateY(0); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the column -->
  <rect x="200" y="30" width="240" height="306" rx="16" fill="#FFFFFF" fill-opacity=".75" stroke="#D9E2F1" filter="url(#soft)"/>
  <rect x="200" y="30" width="240" height="44" rx="16" fill="#FCD34D"/>
  <rect x="200" y="58" width="240" height="16" fill="#FCD34D"/>
  <g class="press">
    <rect x="212" y="40" width="26" height="24" rx="7" fill="#FEF3C7"/>
    <path d="M220 47 v11 m-3 -3 l3 3 l3 -3 M230 57 v-11 m-3 3 l3 -3 l3 3" fill="none" stroke="#422006" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="246" y="57" font-size="13.5" font-weight="600" fill="#422006">Quoted</text>
  <text class="label" x="300" y="57" font-size="11.5" fill="#713F12">· A – Z</text>
  <rect x="408" y="41" width="22" height="22" rx="11" fill="#FEF3C7"/>
  <text x="419" y="56" text-anchor="middle" font-size="11" font-weight="700" fill="#422006">3</text>

  <!-- the cards (they reorder: Adams to the top) -->
  <g font-size="12">
    <g class="b">
      <rect x="214" y="88" width="212" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="228" y="109" font-weight="600" fill="#0F172A">Brown Laundry</text>
      <text x="228" y="126" font-size="10.5" fill="#64748B">Liam Brown</text>
    </g>
    <g class="c">
      <rect x="214" y="146" width="212" height="50" rx="10" fill="#FFFFFF" stroke="#E2E8F0"/>
      <text x="228" y="167" font-weight="600" fill="#0F172A">Clarke Vanity</text>
      <text x="228" y="184" font-size="10.5" fill="#64748B">Noah Clarke</text>
    </g>
    <g class="a">
      <rect x="214" y="204" width="212" height="50" rx="10" fill="#DBEAFE" stroke="#3B82F6"/>
      <text x="228" y="225" font-weight="600" fill="#1E3A8A">Adams Pantry</text>
      <text x="228" y="242" font-size="10.5" fill="#1D4ED8">Ella Adams</text>
    </g>
  </g>

  <!-- the sort menu -->
  <g class="menu" filter="url(#pop)">
    <rect x="212" y="70" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#D9E2F1"/>
    <rect class="pick" x="218" y="78" width="156" height="26" rx="7" fill="#EFF6FF"/>
    <g font-size="12" fill="#0F172A">
      <text x="230" y="96">Custom order</text>
      <text x="230" y="122">Oldest – Newest</text>
      <text x="230" y="148">Newest – Oldest</text>
      <text x="230" y="174" font-weight="600" fill="#1D4ED8">A – Z</text>
      <text x="230" y="200">Z – A</text>
    </g>
  </g>
</svg>
