<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>In the Quote window, Accept is pressed and confirmed for the client, and the quote is stamped as accepted on behalf of the client by the staff member who did it</title>
  <style>
    .press { transform-box: fill-box; transform-origin: center; animation: press 8s ease-in-out infinite both; }
    @keyframes press { 0%, 18% { transform: scale(1); } 20% { transform: scale(.92); } 23%, 100% { transform: scale(1); } }
    .shade { animation: shade 8s ease infinite both; }
    @keyframes shade { 0%, 22% { opacity: 0; } 26%, 50% { opacity: 1; } 54%, 100% { opacity: 0; } }
    .modal { transform-box: fill-box; transform-origin: center; animation: modal 8s cubic-bezier(.34, 1.4, .64, 1) infinite both; }
    @keyframes modal { 0%, 22% { opacity: 0; transform: scale(.9); } 27%, 50% { opacity: 1; transform: scale(1); } 54%, 100% { opacity: 0; transform: scale(.96); } }
    .confirm { transform-box: fill-box; transform-origin: center; animation: confirm 8s ease-in-out infinite both; }
    @keyframes confirm { 0%, 44% { transform: scale(1); } 46% { transform: scale(.93); } 49%, 100% { transform: scale(1); } }
    .stamp { animation: stamp 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes stamp { 0%, 54% { opacity: 0; transform: translateY(-10px); } 60%, 94% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; transform: translateY(0); } }
    .acceptBtn { animation: acceptBtn 8s ease infinite both; }
    @keyframes acceptBtn { 0%, 54% { opacity: 1; } 58%, 94% { opacity: 0; } 98%, 100% { opacity: 1; } }
    .cursor { animation: cursor 8s ease-in-out infinite both; }
    @keyframes cursor {
      0%, 6% { transform: translate(600px, 340px); opacity: 0; }
      10% { opacity: 1; }
      16%, 20% { transform: translate(462px, 314px); opacity: 1; }
      40%, 47% { transform: translate(380px, 236px); opacity: 1; }
      60%, 100% { transform: translate(600px, 340px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3FA872"/>
      <stop offset="1" stop-color="#2E8C5C"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the quote -->
  <rect x="96" y="22" width="448" height="270" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <text x="120" y="56" font-size="16" font-weight="700" fill="#0F172A">Quote</text>
  <text x="120" y="75" font-size="11" font-weight="500" fill="#334155">Patel Kitchen &amp; Scullery · Anil Patel</text>
  <g class="stamp">
    <rect x="120" y="88" width="400" height="30" rx="15" fill="#DCFCE7" stroke="#86EFAC"/>
    <circle cx="138" cy="103" r="8" fill="url(#green)"/>
    <path d="M134 103 l3 3 l5 -6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="152" y="107" font-size="10.5" font-weight="600" fill="#166534">Accepted on behalf of Anil Patel by Alex Morgan · 20 Oct</text>
  </g>
  <path d="M120 130 H520" stroke="#E2E8F0"/>
  <text x="120" y="152" font-size="11" font-weight="600" fill="#0F172A">Kitchen</text>
  <text x="520" y="152" text-anchor="end" font-size="11" font-weight="600" fill="#0F172A">$12,840.00</text>
  <text x="120" y="174" font-size="11" font-weight="600" fill="#0F172A">Scullery</text>
  <text x="520" y="174" text-anchor="end" font-size="11" font-weight="600" fill="#0F172A">$4,310.00</text>
  <text x="120" y="196" font-size="11" font-weight="500" fill="#334155">Install</text>
  <text x="520" y="196" text-anchor="end" font-size="11" font-weight="500" fill="#334155">$1,300.00</text>
  <path d="M120 210 H520" stroke="#E2E8F0"/>
  <text x="120" y="236" font-size="12" font-weight="700" fill="#0F172A">Total incl GST</text>
  <text x="520" y="236" text-anchor="end" font-size="16" font-weight="700" fill="#0F172A">$18,450.00</text>

  <!-- the Quote window's bottom bar -->
  <rect x="176" y="298" width="288" height="44" rx="22" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <rect x="184" y="305" width="80" height="30" rx="15" fill="#F1F5F9"/>
  <text x="224" y="324" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Versions</text>
  <rect x="270" y="305" width="104" height="30" rx="15" fill="#F1F5F9"/>
  <text x="322" y="324" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Send to Client</text>
  <g class="acceptBtn">
    <g class="press">
      <rect x="380" y="305" width="76" height="30" rx="15" fill="url(#green)"/>
      <text x="418" y="324" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Accept</text>
    </g>
  </g>

  <!-- confirming it -->
  <rect class="shade" width="640" height="360" fill="#0F172A" fill-opacity=".18"/>
  <g class="modal">
    <rect x="170" y="104" width="300" height="160" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <circle cx="198" cy="134" r="12" fill="url(#green)"/>
    <path d="M193 134 l4 4 l6 -7" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="218" y="139" font-size="13" font-weight="700" fill="#0F172A">Accept for Anil Patel?</text>
    <text x="190" y="170" font-size="10.5" font-weight="500" fill="#334155">The quote of $18,450.00 is marked accepted —</text>
    <text x="190" y="186" font-size="10.5" font-weight="500" fill="#334155">on behalf of Anil Patel, by you.</text>
    <rect x="262" y="214" width="70" height="30" rx="15" fill="#F1F5F9"/>
    <text x="297" y="233" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Cancel</text>
    <g class="confirm">
      <rect x="338" y="214" width="114" height="30" rx="15" fill="url(#green)"/>
      <text x="395" y="233" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">Accept for them</text>
    </g>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
