<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>In the Production cutlist, a contractor's notes are dragged off their button into a floating bubble, a second one is popped out beside it, and the first is shrunk to a pill</title>
  <style>
    .b1 { transform-box: fill-box; transform-origin: 50% 100%; animation: b1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes b1 {
      0%, 12% { opacity: 0; transform: translate(150px, 210px) scale(.25); }
      16% { opacity: 1; transform: translate(150px, 190px) scale(.5); }
      30%, 92% { opacity: 1; transform: translate(0, 0) scale(1); }
      96%, 100% { opacity: 0; transform: translate(0, 0) scale(1); }
    }
    .body1 { animation: body1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes body1 { 0%, 66% { opacity: 1; } 70%, 92% { opacity: 0; } 96%, 100% { opacity: 1; } }
    .pill1 { animation: pill1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes pill1 { 0%, 66% { opacity: 0; } 70%, 92% { opacity: 1; } 96%, 100% { opacity: 0; } }
    .b2 { transform-box: fill-box; transform-origin: 50% 100%; animation: b2 8s cubic-bezier(.34, 1.4, .64, 1) infinite both; }
    @keyframes b2 { 0%, 42% { opacity: 0; transform: translate(-60px, 190px) scale(.3); } 52%, 92% { opacity: 1; transform: translate(0, 0) scale(1); } 96%, 100% { opacity: 0; transform: translate(0, 0) scale(1); } }
    .press1 { animation: press1 8s ease infinite both; }
    @keyframes press1 { 0%, 9% { fill: #FFFFFF; } 11%, 30% { fill: #E0E7FF; } 34%, 100% { fill: #FFFFFF; } }
    .press2 { animation: press2 8s ease infinite both; }
    @keyframes press2 { 0%, 40% { fill: #FFFFFF; } 42%, 52% { fill: #E0E7FF; } 56%, 100% { fill: #FFFFFF; } }
    .cursor { animation: cursor 8s cubic-bezier(.45, 0, .2, 1) infinite both; }
    @keyframes cursor {
      0%, 4% { transform: translate(600px, 340px); opacity: 0; }
      7% { opacity: 1; }
      11% { transform: translate(258px, 326px); opacity: 1; }
      30% { transform: translate(150px, 74px); opacity: 1; }
      36% { transform: translate(150px, 74px); opacity: 1; }
      42%, 44% { transform: translate(352px, 326px); opacity: 1; }
      60% { transform: translate(256px, 74px); opacity: 1; }
      66%, 69% { transform: translate(256px, 74px); opacity: 1; }
      78%, 100% { transform: translate(600px, 340px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the cutlist behind -->
  <rect x="20" y="20" width="600" height="276" rx="20" fill="#FFFFFF" stroke="#D9E2F1"/>
  <text x="40" y="50" font-size="11" font-weight="700" letter-spacing=".8" fill="#0F172A">CUTLIST  |  PATEL KITCHEN &amp; SCULLERY</text>
  <rect x="36" y="66" width="568" height="26" rx="8" fill="#F7E3A6"/>
  <text x="48" y="83" font-size="11" font-weight="700" fill="#0F172A">Front</text>
  <rect x="36" y="98" width="568" height="18" rx="4" fill="#FBF3D9"/>
  <rect x="36" y="120" width="568" height="18" rx="4" fill="#FDF8E8"/>
  <rect x="36" y="142" width="568" height="18" rx="4" fill="#FBF3D9"/>
  <rect x="36" y="170" width="568" height="26" rx="8" fill="#D6EFC9"/>
  <text x="48" y="187" font-size="11" font-weight="700" fill="#0F172A">Panel</text>
  <rect x="36" y="202" width="568" height="18" rx="4" fill="#E9F6E2"/>
  <rect x="36" y="224" width="568" height="18" rx="4" fill="#F3FAEF"/>
  <rect x="36" y="252" width="568" height="26" rx="8" fill="#5C6670"/>
  <text x="48" y="269" font-size="11" font-weight="700" fill="#FFFFFF">Cabinet</text>

  <!-- the contractors' bar -->
  <rect x="168" y="308" width="304" height="40" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <rect x="176" y="314" width="64" height="28" rx="14" fill="#F1F5F9"/>
  <text x="208" y="332" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Notes</text>
  <rect class="press1" x="244" y="314" width="80" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="284" y="332" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Electrician</text>
  <rect class="press2" x="328" y="314" width="68" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="362" y="332" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Plumber</text>
  <rect x="400" y="314" width="64" height="28" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text x="432" y="332" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0F172A">Stone</text>

  <!-- the electrician's notes, popped out (then shrunk to a pill) -->
  <g class="b1">
    <g class="body1">
      <rect x="60" y="60" width="230" height="150" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
      <path d="M246 72 l6 6 l6 -6" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M60 96 H290" stroke="#E2E8F0"/>
      <rect x="76" y="106" width="198" height="20" rx="6" fill="#F8FAFC"/>
      <text x="84" y="120" font-size="10" font-weight="500" fill="#0F172A">Isolate power to the island</text>
      <rect x="76" y="132" width="198" height="20" rx="6" fill="#F8FAFC"/>
      <text x="84" y="146" font-size="10" font-weight="500" fill="#0F172A">2 double sockets on splashback</text>
      <rect x="76" y="158" width="198" height="20" rx="6" fill="#F8FAFC"/>
      <text x="84" y="172" font-size="10" font-weight="500" fill="#0F172A">Rangehood: wire at 1950</text>
      <path d="M278 200 l6 -6 M282 202 l4 -4" stroke="#CBD5E1" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    <g class="pill1">
      <rect x="60" y="60" width="230" height="36" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
      <path d="M246 81 l6 -6 l6 6" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="80" y="83" font-size="12" font-weight="700" fill="#0F172A">Electrician</text>
    <path d="M268 72 l8 8 M276 72 l-8 8" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- the plumber's, beside it -->
  <g class="b2">
    <rect x="356" y="66" width="230" height="130" rx="18" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
    <text x="376" y="89" font-size="12" font-weight="700" fill="#0F172A">Plumber</text>
    <path d="M542 78 l6 6 l6 -6" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M564 78 l8 8 M572 78 l-8 8" stroke="#64748B" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M356 102 H586" stroke="#E2E8F0"/>
    <rect x="372" y="112" width="198" height="20" rx="6" fill="#F8FAFC"/>
    <text x="380" y="126" font-size="10" font-weight="500" fill="#0F172A">Sink waste through the back</text>
    <rect x="372" y="138" width="198" height="20" rx="6" fill="#F8FAFC"/>
    <text x="380" y="152" font-size="10" font-weight="500" fill="#0F172A">Dishwasher on the left</text>
    <rect x="372" y="164" width="198" height="20" rx="6" fill="#F8FAFC"/>
    <text x="380" y="178" font-size="10" font-weight="500" fill="#0F172A">Fridge water line</text>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
