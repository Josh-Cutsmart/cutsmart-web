<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Two people in the same cutlist: each sees the other is editing, Anna's change to a quantity appears on Ben's screen, and Ben's new row appears on Anna's</title>
  <style>
    .aOld { animation: aOld 8s step-end infinite both; }
    .aNew { animation: aNew 8s step-end infinite both; }
    @keyframes aOld { 0% { opacity: 1; } 24% { opacity: 0; } 97% { opacity: 1; } }
    @keyframes aNew { 0% { opacity: 0; } 24% { opacity: 1; } 97% { opacity: 0; } }
    .aEdit { animation: aEdit 8s ease infinite both; }
    @keyframes aEdit { 0%, 14% { opacity: 0; } 16%, 26% { opacity: 1; } 30%, 100% { opacity: 0; } }
    .bOld { animation: bOld 8s step-end infinite both; }
    .bNew { animation: bNew 8s step-end infinite both; }
    @keyframes bOld { 0% { opacity: 1; } 34% { opacity: 0; } 97% { opacity: 1; } }
    @keyframes bNew { 0% { opacity: 0; } 34% { opacity: 1; } 97% { opacity: 0; } }
    .bFlash { animation: bFlash 8s ease-out infinite both; }
    @keyframes bFlash { 0%, 33% { opacity: 0; } 35% { opacity: 1; } 48%, 100% { opacity: 0; } }
    .bRow { animation: bRow 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes bRow { 0%, 52% { opacity: 0; transform: translateY(-6px); } 56%, 94% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    .aRow { animation: aRow 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes aRow { 0%, 62% { opacity: 0; transform: translateY(-6px); } 66%, 94% { opacity: 1; transform: translateY(0); } 98%, 100% { opacity: 0; } }
    .aFlash { animation: aFlash 8s ease-out infinite both; }
    @keyframes aFlash { 0%, 65% { opacity: 0; } 67% { opacity: 1; } 80%, 100% { opacity: 0; } }
    .dot { animation: dot 1.6s ease-in-out infinite both; }
    @keyframes dot { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    .cursorA { animation: cursorA 8s ease-in-out infinite both; }
    @keyframes cursorA {
      0%, 6% { transform: translate(200px, 300px); opacity: 0; }
      9% { opacity: 1; }
      15%, 26% { transform: translate(262px, 132px); opacity: 1; }
      34%, 100% { transform: translate(200px, 300px); opacity: 0; }
    }
    .cursorB { animation: cursorB 8s ease-in-out infinite both; }
    @keyframes cursorB {
      0%, 40% { transform: translate(560px, 320px); opacity: 0; }
      44% { opacity: 1; }
      50%, 54% { transform: translate(410px, 262px); opacity: 1; }
      62%, 100% { transform: translate(560px, 320px); opacity: 0; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- Anna's screen -->
  <rect x="20" y="24" width="292" height="282" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <text x="38" y="50" font-size="10" font-weight="700" letter-spacing=".7" fill="#0F172A">CUTLIST</text>
  <rect x="134" y="36" width="164" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle class="dot" cx="147" cy="47" r="3.5" fill="#22C55E"/>
  <text x="156" y="51" font-size="9.5" font-weight="600" fill="#0F172A">Ben is also editing</text>
  <rect x="34" y="70" width="264" height="22" rx="7" fill="#F7E3A6"/>
  <text x="44" y="85" font-size="10" font-weight="700" fill="#0F172A">Front</text>
  <text x="44" y="110" font-size="9" font-weight="600" fill="#64748B">PART</text>
  <text x="206" y="110" font-size="9" font-weight="600" fill="#64748B">WIDTH</text>
  <text x="262" y="110" font-size="9" font-weight="600" fill="#64748B">QTY</text>
  <rect x="34" y="118" width="264" height="26" rx="6" fill="#FBF3D9"/>
  <text x="44" y="135" font-size="10.5" font-weight="500" fill="#0F172A">Left Hand Sink Door</text>
  <text x="206" y="135" font-size="10.5" font-weight="500" fill="#0F172A">447</text>
  <rect class="aEdit" x="252" y="121" width="36" height="20" rx="5" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
  <text class="aOld" x="266" y="135" font-size="10.5" font-weight="600" fill="#0F172A">1</text>
  <text class="aNew" x="266" y="135" font-size="10.5" font-weight="600" fill="#0F172A">3</text>
  <rect x="34" y="148" width="264" height="26" rx="6" fill="#FDF8E8"/>
  <text x="44" y="165" font-size="10.5" font-weight="500" fill="#0F172A">Sink Doors</text>
  <text x="206" y="165" font-size="10.5" font-weight="500" fill="#0F172A">447</text>
  <text x="266" y="165" font-size="10.5" font-weight="600" fill="#0F172A">2</text>
  <rect x="34" y="178" width="264" height="26" rx="6" fill="#FBF3D9"/>
  <text x="44" y="195" font-size="10.5" font-weight="500" fill="#0F172A">Hob Drawer Fronts</text>
  <text x="206" y="195" font-size="10.5" font-weight="500" fill="#0F172A">896</text>
  <text x="266" y="195" font-size="10.5" font-weight="600" fill="#0F172A">3</text>
  <g class="aRow">
    <rect x="34" y="208" width="264" height="26" rx="6" fill="#FDF8E8"/>
    <rect class="aFlash" x="34" y="208" width="264" height="26" rx="6" fill="#BBF7D0"/>
    <text x="44" y="225" font-size="10.5" font-weight="500" fill="#0F172A">Pantry Doors</text>
    <text x="206" y="225" font-size="10.5" font-weight="500" fill="#0F172A">397</text>
    <text x="266" y="225" font-size="10.5" font-weight="600" fill="#0F172A">2</text>
  </g>
  <circle cx="48" cy="326" r="11" fill="#2563EB"/>
  <text x="48" y="330" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">AN</text>
  <text x="66" y="330" font-size="11.5" font-weight="600" fill="#0F172A">Anna's screen</text>

  <!-- Ben's screen -->
  <rect x="328" y="24" width="292" height="282" rx="20" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <text x="346" y="50" font-size="10" font-weight="700" letter-spacing=".7" fill="#0F172A">CUTLIST</text>
  <rect x="436" y="36" width="170" height="22" rx="11" fill="#F8FAFC" stroke="#E2E8F0"/>
  <circle class="dot" cx="449" cy="47" r="3.5" fill="#22C55E"/>
  <text x="458" y="51" font-size="9.5" font-weight="600" fill="#0F172A">Anna is also editing</text>
  <rect x="342" y="70" width="264" height="22" rx="7" fill="#F7E3A6"/>
  <text x="352" y="85" font-size="10" font-weight="700" fill="#0F172A">Front</text>
  <text x="352" y="110" font-size="9" font-weight="600" fill="#64748B">PART</text>
  <text x="514" y="110" font-size="9" font-weight="600" fill="#64748B">WIDTH</text>
  <text x="570" y="110" font-size="9" font-weight="600" fill="#64748B">QTY</text>
  <rect x="342" y="118" width="264" height="26" rx="6" fill="#FBF3D9"/>
  <rect class="bFlash" x="342" y="118" width="264" height="26" rx="6" fill="#BFDBFE"/>
  <text x="352" y="135" font-size="10.5" font-weight="500" fill="#0F172A">Left Hand Sink Door</text>
  <text x="514" y="135" font-size="10.5" font-weight="500" fill="#0F172A">447</text>
  <text class="bOld" x="574" y="135" font-size="10.5" font-weight="600" fill="#0F172A">1</text>
  <text class="bNew" x="574" y="135" font-size="10.5" font-weight="600" fill="#0F172A">3</text>
  <rect x="342" y="148" width="264" height="26" rx="6" fill="#FDF8E8"/>
  <text x="352" y="165" font-size="10.5" font-weight="500" fill="#0F172A">Sink Doors</text>
  <text x="514" y="165" font-size="10.5" font-weight="500" fill="#0F172A">447</text>
  <text x="574" y="165" font-size="10.5" font-weight="600" fill="#0F172A">2</text>
  <rect x="342" y="178" width="264" height="26" rx="6" fill="#FBF3D9"/>
  <text x="352" y="195" font-size="10.5" font-weight="500" fill="#0F172A">Hob Drawer Fronts</text>
  <text x="514" y="195" font-size="10.5" font-weight="500" fill="#0F172A">896</text>
  <text x="574" y="195" font-size="10.5" font-weight="600" fill="#0F172A">3</text>
  <g class="bRow">
    <rect x="342" y="208" width="264" height="26" rx="6" fill="#FDF8E8"/>
    <text x="352" y="225" font-size="10.5" font-weight="500" fill="#0F172A">Pantry Doors</text>
    <text x="514" y="225" font-size="10.5" font-weight="500" fill="#0F172A">397</text>
    <text x="574" y="225" font-size="10.5" font-weight="600" fill="#0F172A">2</text>
  </g>
  <rect x="352" y="250" width="110" height="26" rx="13" fill="#2563EB"/>
  <text x="407" y="267" text-anchor="middle" font-size="10.5" font-weight="600" fill="#FFFFFF">Add to Cutlist</text>
  <circle cx="356" cy="326" r="11" fill="#0F766E"/>
  <text x="356" y="330" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">BE</text>
  <text x="374" y="330" font-size="11.5" font-weight="600" fill="#0F172A">Ben's screen</text>

  <g class="cursorA">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
  <g class="cursorB">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F766E" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
