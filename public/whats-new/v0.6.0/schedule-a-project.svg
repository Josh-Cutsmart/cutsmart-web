<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Smith Kitchen is dragged from the Schedule a project panel onto a day in the month, where it books in as a calendar event</title>
  <style>
    .drag { animation: drag 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes drag { 0%, 10% { transform: translate(0, 0) rotate(0deg); opacity: 1; } 16% { transform: translate(4px, -4px) rotate(-3deg); opacity: 1; } 44% { transform: translate(324px, 96px) rotate(-3deg); opacity: 1; } 50%, 100% { transform: translate(324px, 96px) rotate(0deg); opacity: 0; } }
    .slot { animation: slot 8s ease infinite both; }
    @keyframes slot { 0%, 26% { opacity: 0; } 32%, 46% { opacity: 1; } 50%, 100% { opacity: 0; } }
    .ev { animation: ev 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes ev { 0%, 47% { opacity: 0; transform: translateY(0px); } 52%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .nb { animation: nb 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes nb { 0%, 54% { opacity: 0; transform: translateY(4px); } 59%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .done { animation: done 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes done { 0%, 64% { opacity: 0; transform: translateY(10px); } 69%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .gone { animation: gone 8s ease infinite both; }
    @keyframes gone { 0%, 8% { opacity: 1; } 12%, 92% { opacity: .25; } 97%, 100% { opacity: 1; } }

  </style>
