<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>Nesting on a CNC: smaller pieces slide into the corner of an L and the middle of a U on one sheet, with the board list down the left</title>
  <style>
    .l { animation: l 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes l { 0%, 6% { opacity: 0; transform: translateY(10px); } 11%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .a { animation: a 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes a { 0%, 18% { opacity: 0; transform: translate(-150px, 40px); } 26%, 92% { opacity: 1; transform: translate(0, 0); } 96%, 100% { opacity: 0; transform: translate(0, 0); } }
    .b { animation: b 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes b { 0%, 28% { opacity: 0; transform: translate(170px, -30px); } 36%, 92% { opacity: 1; transform: translate(0, 0); } 96%, 100% { opacity: 0; transform: translate(0, 0); } }
    .c { animation: c 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes c { 0%, 38% { opacity: 0; transform: translate(150px, 60px); } 46%, 92% { opacity: 1; transform: translate(0, 0); } 96%, 100% { opacity: 0; transform: translate(0, 0); } }
    .e { animation: e 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes e { 0%, 48% { opacity: 0; transform: translate(-170px, 70px); } 56%, 92% { opacity: 1; transform: translate(0, 0); } 96%, 100% { opacity: 0; transform: translate(0, 0); } }
    .u { animation: u 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes u { 0%, 58% { opacity: 0; transform: translateY(10px); } 63%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .stat { animation: stat 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes stat { 0%, 68% { opacity: 0; transform: translateY(10px); } 73%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .count1 { animation: count1 8s step-end infinite both; } .count2 { animation: count2 8s step-end infinite both; }
    @keyframes count1 { 0% { opacity: 1; } 68% { opacity: 0; } 98% { opacity: 1; } }
    @keyframes count2 { 0% { opacity: 0; } 68% { opacity: 1; } 98% { opacity: 0; } }

  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>
  <rect x="18" y="18" width="130" height="324" rx="16" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <text x="32" y="44" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Boards</text>
  <rect x="28" y="58" width="110" height="46" rx="10" fill="#EFF6FF" stroke="#E2E8F0"/><text x="36" y="76" font-size="9.5" font-weight="600" fill="#0F172A" text-anchor="start">Natural Oak</text><rect x="36" y="86" width="94" height="6" rx="3" fill="#E2E8F0"/><rect x="36" y="86" width="81" height="6" rx="3" fill="#2563EB"/>
  <rect x="28" y="114" width="110" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><text x="36" y="132" font-size="9.5" font-weight="600" fill="#0F172A" text-anchor="start">White Melamine</text><rect x="36" y="142" width="94" height="6" rx="3" fill="#E2E8F0"/><rect x="36" y="142" width="58" height="6" rx="3" fill="#94A3B8"/>
  <rect x="28" y="170" width="110" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/><text x="36" y="188" font-size="9.5" font-weight="600" fill="#0F172A" text-anchor="start">Black Oak</text><rect x="36" y="198" width="94" height="6" rx="3" fill="#E2E8F0"/><rect x="36" y="198" width="41" height="6" rx="3" fill="#94A3B8"/>
  <rect x="162" y="18" width="460" height="324" rx="16" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <rect x="180" y="54" width="424" height="232" rx="4" fill="#FEF7E6" stroke="#D6B98C" stroke-width="1.5"/>
  <text x="180" y="42" font-size="12.5" font-weight="600" fill="#0F172A" text-anchor="start">Sheet 1, cut by true shape</text>
  <path class="l" d="M188 62 L368 62 L368 142 L268 142 L268 278 L188 278 Z" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.4" stroke-linejoin="round"/>
  <rect class="a" x="274" y="150" width="94" height="58" rx="2" fill="#FDE68A" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round"/>
  <rect class="b" x="274" y="214" width="94" height="64" rx="2" fill="#FDE68A" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round"/>
  <path class="u" d="M376 62 L596 62 L596 192 L536 192 L536 122 L436 122 L436 192 L376 192 Z" fill="#BFDBFE" stroke="#2563EB" stroke-width="1.4" stroke-linejoin="round"/>
  <rect class="c" x="444" y="130" width="84" height="62" rx="2" fill="#BBF7D0" stroke="#15803D" stroke-width="1.4" stroke-linejoin="round"/>
  <rect class="e" x="376" y="200" width="220" height="78" rx="2" fill="#FDE68A" stroke="#B45309" stroke-width="1.4" stroke-linejoin="round"/>
  <g class="stat"><rect x="180" y="300" width="118" height="28" rx="14.0" fill="#EFF6FF"/><text x="239.0" y="318.0" text-anchor="middle" font-size="11" font-weight="600" fill="#2563EB">Pieces fit together</text><rect x="306" y="300" width="92" height="28" rx="14.0" fill="#ECFDF5"/><text x="352.0" y="318.0" text-anchor="middle" font-size="11" font-weight="600" fill="#047857">93% used</text></g>
</svg>
