<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>An L-shaped piece is drawn with its sizes and a rounded corner, beside a custom corner cabinet that works out its own ends, top, bottom and L-shaped shelves</title>
  <style>
    .outline { stroke-dasharray: 1200; animation: outline 8s ease-in-out infinite both; }
    @keyframes outline { 0%, 4% { stroke-dashoffset: 1200; fill-opacity: 0; } 28% { stroke-dashoffset: 0; fill-opacity: 0; } 34%, 92% { stroke-dashoffset: 0; fill-opacity: 1; opacity: 1; } 97%, 100% { stroke-dashoffset: 0; fill-opacity: 1; opacity: 0; } }
    .d1 { animation: d1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes d1 { 0%, 28% { opacity: 0; transform: translateY(4px); } 33%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .d2 { animation: d2 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes d2 { 0%, 32% { opacity: 0; transform: translateY(4px); } 37%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .d3 { animation: d3 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes d3 { 0%, 36% { opacity: 0; transform: translateY(4px); } 41%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .rnd { animation: rnd 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes rnd { 0%, 40% { opacity: 0; transform: translateY(4px); } 45%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .cab { animation: cab 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes cab { 0%, 50% { opacity: 0; transform: translateY(10px); } 55%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .s1 { animation: s1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes s1 { 0%, 58% { opacity: 0; transform: translateY(-6px); } 63%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .s2 { animation: s2 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes s2 { 0%, 63% { opacity: 0; transform: translateY(-6px); } 68%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .tag1 { animation: tag1 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes tag1 { 0%, 70% { opacity: 0; transform: translateY(10px); } 75%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }
    .tag2 { animation: tag2 8s cubic-bezier(.22, 1, .36, 1) infinite both; }
    @keyframes tag2 { 0%, 75% { opacity: 0; transform: translateY(10px); } 80%, 92% { opacity: 1; transform: translateY(0); } 96%, 100% { opacity: 0; transform: translateY(0); } }

  </style>
