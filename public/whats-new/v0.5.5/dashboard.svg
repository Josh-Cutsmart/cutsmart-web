<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The Dashboard on one flat colour: pill-shaped tabs and buttons, and project rows whose dividers and hover highlight fade out at each end</title>
  <style>
    .hover { animation: hover 6s cubic-bezier(.45, 0, .2, 1) infinite both; }
    @keyframes hover {
      0%, 4% { transform: translateY(0); opacity: 0; }
      8%, 22% { transform: translateY(0); opacity: 1; }
      30%, 44% { transform: translateY(34px); opacity: 1; }
      52%, 66% { transform: translateY(68px); opacity: 1; }
      74%, 88% { transform: translateY(102px); opacity: 1; }
      94%, 100% { transform: translateY(102px); opacity: 0; }
    }
    .pill { transform-box: fill-box; transform-origin: center; animation: pill 6s cubic-bezier(.34, 1.56, .64, 1) infinite both; }
    @keyframes pill { 0%, 6% { transform: scale(.4); opacity: 0; } 14%, 100% { transform: scale(1); opacity: 1; } }
    .pill2 { animation-delay: .12s; }
    .pill3 { animation-delay: .24s; }
  </style>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D7DEE8" stop-opacity="0"/>
      <stop offset=".12" stop-color="#D7DEE8"/>
      <stop offset=".88" stop-color="#D7DEE8"/>
      <stop offset="1" stop-color="#D7DEE8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E3E9F2" stop-opacity="0"/>
      <stop offset=".12" stop-color="#E3E9F2"/>
      <stop offset=".88" stop-color="#E3E9F2"/>
      <stop offset="1" stop-color="#E3E9F2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="card" x="-20%" y="-30%" width="140%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1F2937" flood-opacity=".1"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#F5F7FA"/>

  <!-- the top tab bar: see-through, pill tabs that fit their names -->
  <rect x="24" y="12" width="96" height="28" rx="14" fill="#FFFFFF" fill-opacity=".7"/>
  <g fill="none" stroke="#475569" stroke-width="1.3"><rect x="36" y="21" width="4.5" height="4.5" rx="1"/><rect x="43" y="21" width="4.5" height="4.5" rx="1"/><rect x="36" y="28" width="4.5" height="4.5" rx="1"/><rect x="43" y="28" width="4.5" height="4.5" rx="1"/></g>
  <text x="56" y="30.5" font-size="10.5" font-weight="700" fill="#334155">Dashboard</text>
  <rect x="128" y="12" width="164" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-opacity=".4"/>
  <text x="142" y="30.5" font-size="10.5" font-weight="700" fill="#0F172A">Harbour View Kitchen</text>
  <path d="M276 22.5 l6 6 m0 -6 l-6 6" stroke="#64748B" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="300" y="12" width="120" height="28" rx="14" fill="#FFFFFF" fill-opacity=".6"/>
  <text x="314" y="30.5" font-size="10.5" font-weight="700" fill="#475569">Bayview Vanity</text>
  <path d="M404 22.5 l6 6 m0 -6 l-6 6" stroke="#94A3B8" stroke-width="1.3" stroke-linecap="round"/>

  <!-- stat cards, their shadows whole -->
  <g filter="url(#card)">
    <rect x="24" y="56" width="139" height="68" rx="16" fill="#FFFFFF"/>
    <rect x="175" y="56" width="139" height="68" rx="16" fill="#FFFFFF"/>
    <rect x="326" y="56" width="139" height="68" rx="16" fill="#FFFFFF"/>
    <rect x="477" y="56" width="139" height="68" rx="16" fill="#FFFFFF"/>
  </g>
  <circle cx="44" cy="76" r="9" fill="#3B82F6"/><circle cx="195" cy="76" r="9" fill="#F59E0B"/><circle cx="346" cy="76" r="9" fill="#22C55E"/><circle cx="497" cy="76" r="9" fill="#8B5CF6"/>
  <g font-size="10" fill="#475569"><text x="58" y="80">Projects</text><text x="209" y="80">Active</text><text x="360" y="80">Completed</text><text x="511" y="80">Staff</text></g>
  <g font-size="21" font-weight="700" fill="#0F172A"><text x="36" y="112">12</text><text x="187" y="112">10</text><text x="338" y="112">2</text><text x="489" y="112">4</text></g>

  <!-- the toolbar: all pills, lined up with the cards -->
  <rect x="24" y="142" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#D7DEE8"/>
  <circle cx="42" cy="156" r="5" fill="none" stroke="#64748B" stroke-width="1.4"/>
  <path d="M45.6 159.6 l3 3" stroke="#64748B" stroke-width="1.4" stroke-linecap="round"/>
  <text x="56" y="161" font-size="10.5" fill="#94A3B8">Search</text>
  <rect x="202" y="142" width="68" height="30" rx="15" fill="#FFFFFF" stroke="#D7DEE8"/>
  <rect x="206" y="146" width="30" height="22" rx="11" fill="url(#brand)"/>
  <rect x="215.5" y="151.5" width="11" height="11" rx="2" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
  <path d="M215.5 155.2 H226.5 M215.5 158.8 H226.5" stroke="#FFFFFF" stroke-width="1.3"/>
  <path d="M247 151.5 V162.5 M252 151.5 V159 M257 151.5 V156" stroke="#64748B" stroke-width="1.6" stroke-linecap="round"/>
  <g class="pill"><rect x="438" y="142" width="44" height="30" rx="15" fill="url(#brand)"/><text x="460" y="161" text-anchor="middle" font-size="10.5" font-weight="700" fill="#FFFFFF">All</text></g>
  <g class="pill pill2"><rect x="488" y="142" width="56" height="30" rx="15" fill="#FFFFFF" stroke="#D7DEE8"/><text x="516" y="161" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Active</text></g>
  <g class="pill pill3"><rect x="550" y="142" width="66" height="30" rx="15" fill="#FFFFFF" stroke="#D7DEE8"/><text x="583" y="161" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0F172A">Completed</text></g>

  <!-- the rows: the hover highlight and the dividers fade out at each end -->
  <rect class="hover" x="24" y="190" width="592" height="34" fill="url(#glow)"/>
  <g fill="url(#fade)">
    <rect x="24" y="223" width="592" height="1"/><rect x="24" y="257" width="592" height="1"/><rect x="24" y="291" width="592" height="1"/><rect x="24" y="325" width="592" height="1"/>
  </g>
  <g font-size="11" font-weight="700" fill="#0F172A">
    <text x="40" y="211">Harbour View Kitchen</text>
    <text x="40" y="245">Ellis St Laundry</text>
    <text x="40" y="279">Bayview Vanity</text>
    <text x="40" y="313">Smith Kitchen Renovation</text>
    <text x="40" y="347">Henderson Laundry</text>
  </g>
  <g font-size="10" fill="#475569">
    <text x="300" y="211">Oct 8 | 4:45pm</text><text x="300" y="245">Oct 8 | 12:46pm</text><text x="300" y="279">Oct 8 | 2:49am</text><text x="300" y="313">Oct 7 | 8:55pm</text><text x="300" y="347">Oct 6 | 8:57pm</text>
  </g>
  <g font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <rect x="540" y="197" width="70" height="20" rx="10" fill="#EA7A2B"/><text x="575" y="211">New</text>
    <rect x="540" y="231" width="70" height="20" rx="10" fill="#EA7A2B"/><text x="575" y="245">New</text>
    <rect x="540" y="265" width="70" height="20" rx="10" fill="#C44BD9"/><text x="575" y="279">Design</text>
    <rect x="540" y="299" width="70" height="20" rx="10" fill="#3B5FD0"/><text x="575" y="313">Production</text>
    <rect x="540" y="333" width="70" height="20" rx="10" fill="#3B5FD0"/><text x="575" y="347">Production</text>
  </g>
</svg>
