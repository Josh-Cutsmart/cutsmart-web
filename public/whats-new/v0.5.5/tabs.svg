<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The top tab bar: tabs sized to their names, a blue outline on hover that turns red over the X, and a closed tab popping away as the next slides over</title>
  <style>
    .blue { animation: blue 6s ease-in-out infinite both; }
    @keyframes blue { 0%, 13% { opacity: 0; } 17%, 30% { opacity: 1; } 33%, 100% { opacity: 0; } }
    .red { animation: red 6s ease-in-out infinite both; }
    @keyframes red { 0%, 30% { opacity: 0; } 33%, 46% { opacity: 1; } 47%, 100% { opacity: 0; } }
    .closing { transform-box: fill-box; transform-origin: center; animation: closing 6s ease-in infinite both; }
    @keyframes closing {
      0%, 46% { opacity: 1; transform: scale(1); }
      48.5% { opacity: 1; transform: scale(1.1); }
      52%, 89% { opacity: 0; transform: scale(.4); }
      93% { opacity: 1; transform: scale(1.12); }
      96%, 100% { opacity: 1; transform: scale(1); }
    }
    .slide { animation: slide 6s cubic-bezier(.45, 0, .2, 1) infinite both; }
    @keyframes slide { 0%, 53% { transform: translateX(0); } 62%, 88% { transform: translateX(-152px); } 94%, 100% { transform: translateX(0); } }
    .cursor { animation: cursor 6s ease-in-out infinite both; }
    @keyframes cursor {
      0%, 3% { transform: translate(560px, 320px); opacity: 0; }
      7% { opacity: 1; }
      15%, 27% { transform: translate(420px, 192px); opacity: 1; }
      32%, 46% { transform: translate(487px, 186px); opacity: 1; }
      58%, 100% { transform: translate(560px, 320px); opacity: 0; }
    }
    .press { transform-box: fill-box; transform-origin: center; animation: press 6s ease-in-out infinite both; }
    @keyframes press { 0%, 43% { transform: scale(1); } 45% { transform: scale(.8); } 47%, 100% { transform: scale(1); } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <filter id="tab" x="-10%" y="-30%" width="120%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the page under the bar, faintly -->
  <g fill="#FFFFFF" fill-opacity=".55">
    <rect x="20" y="236" width="140" height="84" rx="16"/><rect x="172" y="236" width="140" height="84" rx="16"/>
    <rect x="324" y="236" width="140" height="84" rx="16"/><rect x="476" y="236" width="144" height="84" rx="16"/>
  </g>

  <!-- Dashboard -->
  <g filter="url(#tab)">
    <rect x="20" y="164" width="116" height="40" rx="20" fill="#FFFFFF" fill-opacity=".75"/>
  </g>
  <g fill="none" stroke="#475569" stroke-width="1.5"><rect x="36" y="177" width="6" height="6" rx="1.3"/><rect x="45" y="177" width="6" height="6" rx="1.3"/><rect x="36" y="186" width="6" height="6" rx="1.3"/><rect x="45" y="186" width="6" height="6" rx="1.3"/></g>
  <text x="60" y="189" font-size="12.5" font-weight="700" fill="#334155">Dashboard</text>

  <!-- the open project's tab: tinted, blue outline -->
  <g filter="url(#tab)">
    <rect x="146" y="164" width="196" height="40" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="146.75" y="164.75" width="194.5" height="38.5" rx="19.25" fill="#0F172A" fill-opacity=".035" stroke="#2563EB" stroke-opacity=".4" stroke-width="1.5"/>
  <text x="164" y="189" font-size="12.5" font-weight="700" fill="#0F172A">Harbour View Kitchen</text>
  <path d="M319 180 l8 8 m0 -8 l-8 8" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>

  <!-- the one that's closed -->
  <g class="closing">
    <g filter="url(#tab)">
      <rect x="352" y="164" width="142" height="40" rx="20" fill="#FFFFFF" fill-opacity=".75"/>
    </g>
    <rect class="blue" x="352.75" y="164.75" width="140.5" height="38.5" rx="19.25" fill="#0F172A" fill-opacity=".035" stroke="#2563EB" stroke-opacity=".4" stroke-width="1.5"/>
    <rect class="red" x="352.75" y="164.75" width="140.5" height="38.5" rx="19.25" fill="#0F172A" fill-opacity=".035" stroke="#EF4444" stroke-opacity=".6" stroke-width="1.5"/>
    <text x="370" y="189" font-size="12.5" font-weight="700" fill="#475569">Bayview Vanity</text>
    <g class="press">
      <circle cx="477" cy="184" r="10" fill="#E2E8F0" class="red"/>
      <path d="M473 180 l8 8 m0 -8 l-8 8" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- the next one slides over -->
  <g class="slide">
    <g filter="url(#tab)">
      <rect x="504" y="164" width="116" height="40" rx="20" fill="#FFFFFF" fill-opacity=".75"/>
    </g>
    <text x="522" y="189" font-size="12.5" font-weight="700" fill="#475569">Lee Office</text>
    <path d="M597 180 l8 8 m0 -8 l-8 8" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <g class="cursor">
    <path d="M0 0 l0 20 l5 -5 l4 9 l3.4 -1.5 l-4 -9 l7 0 z" fill="#0F172A" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
  </g>
</svg>
