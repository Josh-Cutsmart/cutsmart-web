<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>The new log in page: CutSmart's features slide by beside the log in box, which slides on to setting a PIN</title>
  <style>
    .slideA { animation: slideA 6s ease-in-out infinite both; }
    @keyframes slideA { 0%, 40% { opacity: 1; transform: translateX(0); } 47%, 93% { opacity: 0; transform: translateX(-26px); } 100% { opacity: 1; transform: translateX(0); } }
    .slideB { animation: slideB 6s ease-in-out infinite both; }
    @keyframes slideB { 0%, 40% { opacity: 0; transform: translateX(26px); } 47%, 93% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(26px); } }
    .barA { transform-box: fill-box; transform-origin: 0 50%; animation: barA 6s linear infinite both; }
    @keyframes barA { 0% { transform: scaleX(0); } 44% { transform: scaleX(1); } 47%, 100% { transform: scaleX(0); } }
    .barB { transform-box: fill-box; transform-origin: 0 50%; animation: barB 6s linear infinite both; }
    @keyframes barB { 0%, 47% { transform: scaleX(0); } 97% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    .login { animation: login 6s cubic-bezier(.4, 0, .2, 1) infinite both; }
    @keyframes login { 0%, 40% { opacity: 1; transform: translateX(0); } 48%, 94% { opacity: 0; transform: translateX(-70px); } 100% { opacity: 1; transform: translateX(0); } }
    .pin { animation: pin 6s cubic-bezier(.4, 0, .2, 1) infinite both; }
    @keyframes pin { 0%, 40% { opacity: 0; transform: translateX(70px); } 48%, 94% { opacity: 1; transform: translateX(0); } 100% { opacity: 0; transform: translateX(70px); } }
    .cover1 { transform-box: fill-box; transform-origin: 100% 50%; animation: cover1 6s steps(14, end) infinite both; }
    @keyframes cover1 { 0%, 3% { transform: scaleX(1); } 15%, 100% { transform: scaleX(0); } }
    .cover2 { transform-box: fill-box; transform-origin: 100% 50%; animation: cover2 6s steps(6, end) infinite both; }
    @keyframes cover2 { 0%, 17% { transform: scaleX(1); } 27%, 100% { transform: scaleX(0); } }
    .tick { animation: tick 6s ease-out infinite both; }
    @keyframes tick { 0%, 29% { opacity: 0; } 31%, 100% { opacity: 1; } }
    .press { transform-box: fill-box; transform-origin: center; animation: press 6s ease-in-out infinite both; }
    @keyframes press { 0%, 33% { transform: scale(1); } 36% { transform: scale(.94); } 39%, 100% { transform: scale(1); } }
    .p1 { animation: p1 6s ease-out infinite both; }
    @keyframes p1 { 0%, 54% { opacity: 0; } 56%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .p2 { animation: p2 6s ease-out infinite both; }
    @keyframes p2 { 0%, 60% { opacity: 0; } 62%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .p3 { animation: p3 6s ease-out infinite both; }
    @keyframes p3 { 0%, 66% { opacity: 0; } 68%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
    .p4 { animation: p4 6s ease-out infinite both; }
    @keyframes p4 { 0%, 72% { opacity: 0; } 74%, 94% { opacity: 1; } 97%, 100% { opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF3FB"/>
      <stop offset="1" stop-color="#E1E9F7"/>
    </linearGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity=".08"/>
    </filter>
    <filter id="pop" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity=".16"/>
    </filter>
    <clipPath id="slides"><rect x="52" y="52" width="268" height="206" rx="14"/></clipPath>
    <clipPath id="box"><rect x="360" y="44" width="244" height="272" rx="22"/></clipPath>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <!-- the feature slideshow -->
  <rect x="36" y="36" width="300" height="288" rx="22" fill="#FFFFFF" fill-opacity=".7" stroke="#D9E2F1" filter="url(#soft)"/>
  <g clip-path="url(#slides)">
    <!-- slide 1: the board -->
    <g class="slideA">
      <rect x="60" y="64" width="80" height="182" rx="12" fill="#F59E0B" fill-opacity=".85"/>
      <rect x="146" y="64" width="80" height="182" rx="12" fill="#C44BD9" fill-opacity=".85"/>
      <rect x="232" y="64" width="80" height="182" rx="12" fill="#4F6FD8" fill-opacity=".85"/>
      <g fill="#FFFFFF" fill-opacity=".92">
        <rect x="68" y="96" width="64" height="34" rx="8"/>
        <rect x="68" y="136" width="64" height="34" rx="8"/>
        <rect x="154" y="96" width="64" height="34" rx="8"/>
        <rect x="240" y="96" width="64" height="34" rx="8"/>
        <rect x="240" y="136" width="64" height="34" rx="8"/>
        <rect x="240" y="176" width="64" height="34" rx="8"/>
      </g>
      <g fill="#FFFFFF" font-size="10" font-weight="700">
        <text x="72" y="84">New</text>
        <text x="158" y="84">Design</text>
        <text x="244" y="84">Production</text>
      </g>
    </g>
    <!-- slide 2: the calendar -->
    <g class="slideB">
      <rect x="60" y="64" width="252" height="182" rx="12" fill="#FFFFFF"/>
      <g stroke="#E2E8F0">
        <path d="M60 100 H312 M60 136 H312 M60 172 H312 M60 208 H312"/>
        <path d="M96 64 V246 M132 64 V246 M168 64 V246 M204 64 V246 M240 64 V246 M276 64 V246"/>
      </g>
      <rect x="99" y="106" width="66" height="10" rx="5" fill="#22C55E"/>
      <rect x="171" y="142" width="102" height="10" rx="5" fill="#3B82F6"/>
      <rect x="63" y="178" width="30" height="10" rx="5" fill="#F59E0B"/>
      <rect x="207" y="214" width="66" height="10" rx="5" fill="#C44BD9"/>
      <rect x="135" y="120" width="30" height="10" rx="5" fill="#14B8A6"/>
    </g>
  </g>
  <g font-size="13" font-weight="600" fill="#0F172A" text-anchor="middle">
    <text class="slideA" x="186" y="284">Every project, at a glance</text>
    <text class="slideB" x="186" y="284">Your whole team's calendar</text>
  </g>
  <rect x="140" y="300" width="42" height="6" rx="3" fill="#DCE5F3"/>
  <rect class="barA" x="140" y="300" width="42" height="6" rx="3" fill="#2563EB"/>
  <rect x="190" y="300" width="42" height="6" rx="3" fill="#DCE5F3"/>
  <rect class="barB" x="190" y="300" width="42" height="6" rx="3" fill="#2563EB"/>

  <!-- the log in box -->
  <rect x="360" y="44" width="244" height="272" rx="22" fill="#FFFFFF" stroke="#D9E2F1" filter="url(#pop)"/>
  <rect x="462" y="60" width="40" height="40" rx="11" fill="url(#icon)"/>
  <text x="482" y="88" text-anchor="middle" font-size="21" font-weight="800" fill="#FFFFFF">C</text>
  <g clip-path="url(#box)">
    <g class="login">
      <text x="482" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Log in</text>
      <rect x="380" y="142" width="204" height="32" rx="10" fill="#F8FAFC" stroke="#D7DEE8"/>
      <rect x="394" y="154" width="116" height="8" rx="4" fill="#94A3B8"/>
      <rect class="cover1" x="392" y="150" width="122" height="16" fill="#F8FAFC"/>
      <rect x="380" y="182" width="204" height="32" rx="10" fill="#F8FAFC" stroke="#D7DEE8"/>
      <g fill="#475569">
        <circle cx="398" cy="198" r="3.2"/><circle cx="410" cy="198" r="3.2"/><circle cx="422" cy="198" r="3.2"/>
        <circle cx="434" cy="198" r="3.2"/><circle cx="446" cy="198" r="3.2"/><circle cx="458" cy="198" r="3.2"/>
      </g>
      <rect class="cover2" x="392" y="190" width="72" height="16" fill="#F8FAFC"/>
      <rect x="382" y="226" width="13" height="13" rx="3.5" fill="#FFFFFF" stroke="#94A3B8"/>
      <g class="tick">
        <rect x="382" y="226" width="13" height="13" rx="3.5" fill="#2563EB"/>
        <path d="M385 232.5 l2.6 2.6 l4.8 -5" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="402" y="236.5" font-size="11.5" fill="#475569">Remember me</text>
      <g class="press">
        <rect x="380" y="254" width="204" height="34" rx="17" fill="#2563EB"/>
        <text x="482" y="275.5" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Log in</text>
      </g>
    </g>
    <g class="pin">
      <text x="482" y="128" text-anchor="middle" font-size="16" font-weight="700" fill="#0F172A">Set a PIN</text>
      <text x="482" y="148" text-anchor="middle" font-size="11.5" fill="#64748B">Unlock CutSmart with it next time</text>
      <g fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5">
        <circle cx="428" cy="196" r="11"/><circle cx="464" cy="196" r="11"/><circle cx="500" cy="196" r="11"/><circle cx="536" cy="196" r="11"/>
      </g>
      <circle class="p1" cx="428" cy="196" r="7" fill="#2563EB"/>
      <circle class="p2" cx="464" cy="196" r="7" fill="#2563EB"/>
      <circle class="p3" cx="500" cy="196" r="7" fill="#2563EB"/>
      <circle class="p4" cx="536" cy="196" r="7" fill="#2563EB"/>
      <text x="482" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#64748B">Skip</text>
    </g>
  </g>
</svg>
